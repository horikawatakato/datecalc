<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日数計算機</title>
  <meta name="description" content="日付を入力すると、今日との差（日数・年数）とその日の曜日を表示する日数計算機。紀元前999年〜西暦9999年対応。">
  <!-- モバイルのブラウザ UI（アドレスバー等）の色をテーマに合わせる -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130e" media="(prefers-color-scheme: dark)">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* 配色は :root に集約（ここでテーマ全体を管理） */
    :root {
      color-scheme: light dark;   /* キャレット・スクロールバー等の OS 描画をテーマに追従させる */
      --bg: #ffffff;
      --surface: #f5f4f0;
      --field-bg: #eeece8;
      --border: #dedad2;
      --accent: #9a6e2e;
      --accent-dim: #b8904a;
      --text: #1a1814;
      --text-muted: #8a8680;
      --text-dim: #5a5650;
      --past: #c0392b;
      --today: #27ae60;
      --future: #2e6eb8;
      --error: #a83e3e;
      --shadow: 0 1px 2px rgba(26,24,20,0.04), 0 6px 18px rgba(26,24,20,0.05);
      --ring: rgba(184,144,74,0.28);
    }

    /* ダーク時のみ配色を差し替え（構造・余白は共通） */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16130e;
        --surface: #201c15;
        --field-bg: #272219;
        --border: #39332a;
        --accent: #dcac67;
        --accent-dim: #b8904a;
        --text: #ece7de;
        --text-muted: #9c948a;
        --text-dim: #c3bcb0;
        --past: #e57468;
        --today: #52cd8f;
        --future: #6fa8e2;
        --error: #e58072;
        --shadow: 0 1px 2px rgba(0,0,0,0.30), 0 8px 24px rgba(0,0,0,0.35);
        --ring: rgba(220,172,103,0.30);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection {
      background: var(--ring);
      color: var(--text);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(154,110,46,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(142,62,168,0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 590px;
    }

    header {
      margin-bottom: 2.5rem;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.4em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* 見出しと今日の日付の間隔を保つためのスペーサー */
    h1::after {
      content: '';
      display: block;
      height: 2px;
      margin-top: 0.8rem;
    }

    .today-badge {
      margin-top: 0.6rem;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .input-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 2px; height: 100%;
      background: var(--accent-dim);
      border-radius: 4px 0 0 4px;
    }

    label {
      display: block;
      font-size: 1rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .date-fields {
      display: flex;
      align-items: center;
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .date-fields:focus-within {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .date-field-wrap {
      display: flex;
      align-items: center;
    }

    .date-field-wrap input[type="text"] {
      background: transparent;
      border: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.2rem;
      padding: 0.9rem 0;
      outline: none;
      color: var(--text);
      caret-color: var(--accent);
      text-align: right;
    }

    /* 各入力幅は桁数に合わせて固定（年=4桁／月・日=2桁） */
    #yearInput  { width: 4.2rem; padding-left: 0.3rem; }
    #monthInput { width: 2.2rem; }
    #dayInput   { width: 2.2rem; }

    .field-unit {
      font-size: 1.05rem;
      color: var(--text-muted);
      padding-right: 0.5rem;
      user-select: none;
    }

    button {
      background: transparent;
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      color: var(--accent);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.08s;
    }

    button:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    button:active { transform: translateY(1px); }

    /* キーボード操作時のみフォーカスリングを表示 */
    button:focus-visible,
    .clear-btn:focus-visible {
      outline: 2px solid var(--accent-dim);
      outline-offset: 2px;
    }

    /* 計算中（fetch 中）の二重送信防止状態を視覚化 */
    button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
    button:disabled:hover {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    /* タッチ端末：タップ後に背景を残さない（PCのホバーは不変） */
    @media (hover: none) {
      .bc-toggle:hover,
      #calcBtn:hover,
      #clearInputBtn:hover {
        background: transparent;
        color: var(--accent);
        border-color: var(--accent-dim);
      }
    }

    #calcBtn { margin-left: 3rem; }

    /* 符号トグル（スマホのみ表示／計算・クリアと同じ配色） */
    .bc-toggle { display: none; }

    .result-area {
      min-height: 5rem;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      animation: fadeSlide 0.3s ease;
      position: relative;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-card.is-error  { border-left: 2px solid var(--error); }
    .result-card.is-past   { border-left: 2px solid var(--past); }
    .result-card.is-today  { border-left: 2px solid var(--today); }
    .result-card.is-future { border-left: 2px solid var(--future); }

    .result-date {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.2rem;
    }

    .result-diff {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 1.1;
      margin: 0.5rem 0 0;
    }

    .is-past   .result-diff { color: var(--past); }
    .is-today  .result-diff { color: var(--today); }
    .is-future .result-diff { color: var(--future); }

    .error-msg {
      color: var(--error);
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* 履歴 */
    .history { margin-top: 1.5rem; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      padding: 0.3rem 0.9rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .clear-btn:hover {
      background: none;
      border: 1px solid var(--text-muted);
      color: var(--text-dim);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: border-color 0.2s;
    }

    .history-item:hover { border-color: var(--accent-dim); }

    .history-item-date { color: var(--text-dim); }
    .history-item-diff.past   { color: var(--past); }
    .history-item-diff.today  { color: var(--today); }
    .history-item-diff.future { color: var(--future); }

    /* ───────── スマホ対応 ───────── */
    @media (max-width: 600px) {
      body { padding: 1.5rem 0.9rem; }

      header { margin-bottom: 1.8rem; }
      h1 { font-size: 1.6rem; letter-spacing: 0.25em; }

      .input-section { padding: 1.2rem; }

      /* 入力行を縦に折り返す */
      .input-row { flex-wrap: wrap; gap: 0.8rem; }

      /* 日付フィールドを横幅いっぱいに、左寄せにする */
      .date-fields {
        width: 100%;
        justify-content: flex-start;
      }
      .date-field-wrap input[type="text"] { padding: 0.8rem 0; }

      /* 紀元前トグルをスマホで表示 */
      .bc-toggle {
        display: inline-block;
        padding: 0.8rem 0.9rem;
        white-space: nowrap;
      }

      /* ボタンは横並びで均等幅・タップしやすいサイズに */
      #calcBtn { margin-left: 0; }
      #calcBtn, #clearInputBtn {
        flex: 1 1 0;
        padding: 0.8rem 0.5rem;
      }

      .result-card { padding: 1.2rem; }
      .result-diff { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>日数計算機</h1>
    <div class="today-badge" id="todayBadge"></div>
  </header>

  <div class="input-section">
    <label>日付を入力</label>
    <div class="input-row">
      <div class="date-fields">
        <div class="date-field-wrap">
          <input type="text" id="yearInput"  inputmode="numeric" maxlength="4" autocomplete="off" spellcheck="false">
          <span class="field-unit">年</span>
        </div>
        <div class="date-field-wrap">
          <input type="text" id="monthInput" inputmode="numeric" maxlength="2" autocomplete="off" spellcheck="false">
          <span class="field-unit">月</span>
        </div>
        <div class="date-field-wrap">
          <input type="text" id="dayInput"   inputmode="numeric" maxlength="2" autocomplete="off" spellcheck="false">
          <span class="field-unit">日</span>
        </div>
      </div>
      <button type="button" id="bcToggle" class="bc-toggle">−</button>
      <button type="button" id="calcBtn">計算</button>
      <button type="button" id="clearInputBtn">クリア</button>
    </div>
  </div>

  <div class="result-area" id="resultArea"></div>

  <div class="history" id="historySection" style="display:none">
    <div class="history-header">
      <h2 class="history-title">履歴</h2>
      <button type="button" class="clear-btn" id="clearBtn">クリア</button>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────────────────
  // DateCalc.html — Python API 呼び出し版
  // 差分の計算は持たず、年月日を /api/calculate（Flask 側）へ送って結果を表示する。
  // 今日の表示（日付・曜日・時刻／JST）・入力バリデーション・フォーカス移動・履歴表示は本ファイルが担当する。
  // ─────────────────────────────────────────────────────────────────────────

  // 曜日の漢字（月曜=0 … 日曜=6。サーバー DateCalc.py の WEEKDAYS と同じ並び）
  const WEEKDAYS = ["月", "火", "水", "木", "金", "土", "日"];

  // 今日の日付・曜日を日本標準時(JST)で求める
  function getTodayParts() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric',
    }).formatToParts(new Date());
    const num = t => parseInt(parts.find(p => p.type === t).value, 10);
    const year = num('year'), month = num('month'), day = num('day');
    // 曜日は JST の年月日から算出（getUTCDay の日曜=0 を月曜=0 に正規化）
    const weekday = WEEKDAYS[(new Date(Date.UTC(year, month - 1, day)).getUTCDay() + 6) % 7];
    return { year, month, day, weekday };
  }

  // 現在時刻を日本標準時(JST)で求める
  function getTodayTime() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
    }).formatToParts(new Date());
    const h = parseInt(parts.find(p => p.type === 'hour').value, 10);
    const m = parts.find(p => p.type === 'minute').value;
    return `${h}:${m}`;
  }

  // 今日の日付・曜日・時刻をヘッダーのバッジ（todayBadge）へ描画する
  function renderTodayBadge() {
    const t = getTodayParts();
    document.getElementById('todayBadge').textContent =
      `${t.year}年${t.month}月${t.day}日 (${t.weekday}) ${getTodayTime()}`;
  }

  renderTodayBadge();                    // 初回即描画
  setInterval(renderTodayBadge, 1000);   // 毎秒更新（時刻の追従＋0時の日付切り替え）

  const yearInput      = document.getElementById('yearInput');
  const monthInput     = document.getElementById('monthInput');
  const dayInput       = document.getElementById('dayInput');
  const resultArea     = document.getElementById('resultArea');
  const historySection = document.getElementById('historySection');
  const historyList    = document.getElementById('historyList');
  const calcBtn        = document.getElementById('calcBtn');
  const clearInputBtn  = document.getElementById('clearInputBtn');
  const clearBtn       = document.getElementById('clearBtn');
  const bcToggle       = document.getElementById('bcToggle');

  // ── 年フィールドの正規化（PC入力時の input ハンドラと同一処理） ──────────
  //   先頭のマイナス1つ ＋ 数字のみ、先頭ゼロ除去
  function normalizeYearValue() {
    let v = yearInput.value;
    const neg = v.startsWith('-');
    let digits = v.replace(/[^\d]/g, '').replace(/^0+/, '');
    // maxlength=4 を符号込みで再現（負号があるときは数字3桁まで）
    const maxDigits = neg ? 3 : 4;
    if (digits.length > maxDigits) digits = digits.slice(0, maxDigits);
    v = (neg ? '-' : '') + digits;
    if (yearInput.value !== v) yearInput.value = v;
  }

  // ── 年フィールドの範囲補正（PC入力時の blur ハンドラと同一処理） ──────────
  function clampYearValue() {
    const val = parseInt(yearInput.value, 10);
    if (isNaN(val) || val === 0) { yearInput.value = ''; return; }
    if (val > 9999)  { yearInput.value = '9999'; return; }
    if (val < -999)  { yearInput.value = '-999'; return; }
  }

  // ── − ボタン：符号を切り替えたうえで、PCと同じ正規化・補正を通す ──────────
  bcToggle.addEventListener('click', () => {
    const digits = yearInput.value.replace('-', '');
    yearInput.value = yearInput.value.startsWith('-') ? digits : '-' + digits;
    normalizeYearValue();
    if (/\d/.test(yearInput.value)) clampYearValue(); // 数字があるときだけ範囲補正（単独「-」は維持）
    yearInput.focus();
  });

  // ── 年フィールド：マイナス記号（先頭のみ）と数字だけを受け付ける ─────────
  yearInput.addEventListener('keydown', ev => {
    if (['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Enter'].includes(ev.key)) return;
    if (ev.key === '-') {
      if (yearInput.selectionStart === 0 && !yearInput.value.startsWith('-')) return;
      ev.preventDefault(); return;
    }
    if (!/^\d$/.test(ev.key)) { ev.preventDefault(); return; }
    const pos = yearInput.selectionStart;
    const val = yearInput.value;
    const effectiveStart = val.startsWith('-') ? 1 : 0;
    if (pos === effectiveStart && ev.key === '0') { ev.preventDefault(); return; }
  });
  yearInput.addEventListener('input', () => {
    normalizeYearValue();
  });
  yearInput.addEventListener('blur', () => {
    clampYearValue();
  });

  // ── 月・日フィールド：数字のみ、範囲外は自動補正 ────────────────────────
  function makeNumericOnly(input, min, max) {
    input.addEventListener('keydown', ev => {
      if (['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Enter'].includes(ev.key)) return;
      if (!/^\d$/.test(ev.key)) { ev.preventDefault(); return; }
      if (ev.key === '0' && input.value === '') { ev.preventDefault(); return; }
    });
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^\d]/g, '').replace(/^0+/, '');
    });
    input.addEventListener('blur', () => {
      const val = parseInt(input.value, 10);
      if (!isNaN(val)) {
        if (val < min) input.value = min;
        else if (val > max) input.value = max;
      }
    });
  }

  makeNumericOnly(monthInput, 1, 99);
  makeNumericOnly(dayInput,   1, 99);

  // ── フィールド間フォーカス移動 ───────────────────────────────────────────
  function moveFocus(target, toEnd) {
    target.focus();
    const pos = toEnd ? target.value.length : 0;
    target.setSelectionRange(pos, pos);
  }

  yearInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); moveFocus(monthInput, false); }
    if (e.key === 'ArrowRight' && yearInput.selectionStart === yearInput.value.length && yearInput.selectionEnd === yearInput.value.length) {
      e.preventDefault(); moveFocus(monthInput, false);
    }
  });
  monthInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); moveFocus(dayInput, false); }
    if (e.key === 'Backspace' && monthInput.value === '') { e.preventDefault(); moveFocus(yearInput, true); }
    if (e.key === 'ArrowRight' && monthInput.selectionStart === monthInput.value.length && monthInput.selectionEnd === monthInput.value.length) {
      e.preventDefault(); moveFocus(dayInput, false);
    }
    if (e.key === 'ArrowLeft' && monthInput.selectionStart === 0 && monthInput.selectionEnd === 0) {
      e.preventDefault(); moveFocus(yearInput, true);
    }
  });
  dayInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); calculate(); }
    if (e.key === 'Backspace' && dayInput.value === '') { e.preventDefault(); moveFocus(monthInput, true); }
    if (e.key === 'ArrowLeft' && dayInput.selectionStart === 0 && dayInput.selectionEnd === 0) {
      e.preventDefault(); moveFocus(monthInput, true);
    }
  });

  // ── 出力エスケープ（サーバー応答を innerHTML に挿入する際の XSS 防御） ────────
  //   要素内容は escapeHtml で無害化する。class 属性に入る cls は既知3値のみ許可し、未知値は空にする。
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const RESULT_CLASSES = new Set(['past', 'today', 'future']);
  const safeCls = c => (RESULT_CLASSES.has(c) ? c : '');

  // ── 履歴 ─────────────────────────────────────────────────────────────────
  let history = [];

  function renderHistory() {
    if (history.length === 0) { historySection.style.display = 'none'; historyList.innerHTML = ''; return; }
    historySection.style.display = 'block';
    historyList.innerHTML = history.map(h => `
      <li class="history-item">
        <span class="history-item-date">${escapeHtml(h.dateStr)}</span>
        <span class="history-item-diff ${safeCls(h.cls)}">${escapeHtml(h.diffLabel)}</span>
      </li>`).join('');
  }

  // ── 計算：fetch で Python API を呼び出す ──────────────────────────────────
  async function calculate() {
    const yStr = yearInput.value.trim();
    const mStr = monthInput.value.trim();
    const dStr = dayInput.value.trim();
    if (!yStr || !mStr || !dStr) return;

    // ボタンを無効化して二重送信を防止
    calcBtn.disabled = true;

    try {
      const params = new URLSearchParams({ year: yStr, month: mStr, day: dStr });
      const res  = await fetch(`/api/calculate?${params}`);
      const data = await res.json();

      if (!data.ok) {
        // Python 側からのエラー（存在しない日付など）
        resultArea.innerHTML =
          `<div class="result-card is-error"><div class="error-msg">${escapeHtml(data.error)}</div></div>`;
        return;
      }

      // 正常結果を表示（紀元前は API 側で BC 表記のラベルが返る）
      resultArea.innerHTML = `
        <div class="result-card is-${safeCls(data.cls)}">
          <div class="result-date">${escapeHtml(data.date_label)}</div>
          <div class="result-diff">${escapeHtml(data.diff_label)}</div>
        </div>`;

      // 履歴に追加（今日は履歴に残さない。重複は先頭に移動、最大 5 件）
      if (data.cls !== 'today') {
        const entry = { dateStr: data.date_label, diffLabel: data.diff_label, cls: data.cls };
        history = [entry, ...history.filter(h => h.dateStr !== entry.dateStr)].slice(0, 5);
        renderHistory();
      }

    } catch (err) {
      // ネットワークエラー・サーバー未起動など
      resultArea.innerHTML =
        `<div class="result-card is-error"><div class="error-msg">` +
        `サーバーに接続できません。<br>` +
        `DateCalc_server.py が起動しているか確認してください。</div></div>`;
    } finally {
      calcBtn.disabled = false;
    }
  }

  // ── イベント登録 ──────────────────────────────────────────────────────────
  calcBtn.addEventListener('click', calculate);

  clearInputBtn.addEventListener('click', () => {
    yearInput.value  = '';
    monthInput.value = '';
    dayInput.value   = '';
    resultArea.innerHTML = '';
    yearInput.focus();
  });

  clearBtn.addEventListener('click', () => {
    history = [];
    renderHistory();
  });
</script>
</body>
</html>

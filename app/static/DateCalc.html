<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日数計算機</title>
  <meta name="description" content="日付を入力すると、今日との差（日数・年数）とその日の曜日を表示する日数計算機。紀元前999年〜西暦9999年対応。">
  <!-- モバイルのブラウザ UI（アドレスバー等）の色をテーマに合わせる -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130e" media="(prefers-color-scheme: dark)">
  <!-- フォント本体の取得先は gstatic（googleapis は下の link で即接続されるので preconnect 不要） -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* 配色は :root に集約（ダークは下の media query で差し替え） */
    :root {
      color-scheme: light dark;   /* キャレット・スクロールバー等の OS 描画をテーマに追従させる */
      --bg: #ffffff;
      --surface: #f5f4f0;
      --field-bg: #eeece8;
      --border: #dedad2;
      --accent: #9a6e2e;
      --accent-dim: #b8904a;
      --text: #1a1814;
      --text-muted: #8a8680;
      --text-dim: #5a5650;
      --past: #c0392b;
      --today: #27ae60;
      --future: #2e6eb8;
      --error: #a83e3e;
      --shadow: 0 1px 2px rgba(26,24,20,0.04), 0 6px 18px rgba(26,24,20,0.05);
      --ring: rgba(184,144,74,0.28);
    }

    /* ダーク時のみ配色を差し替え（構造・余白は共通） */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16130e;
        --surface: #201c15;
        --field-bg: #272219;
        --border: #39332a;
        --accent: #dcac67;
        --accent-dim: #b8904a;
        --text: #ece7de;
        --text-muted: #9c948a;
        --text-dim: #c3bcb0;
        --past: #e57468;
        --today: #52cd8f;
        --future: #6fa8e2;
        --error: #e58072;
        --shadow: 0 1px 2px rgba(0,0,0,0.30), 0 8px 24px rgba(0,0,0,0.35);
        --ring: rgba(220,172,103,0.30);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::selection {
      background: var(--ring);
      color: var(--text);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;              /* 位置指定要素なので、明示しないと静的配置の本文より手前に来る */
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(154,110,46,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(142,62,168,0.03) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 590px;
    }

    header {
      margin-bottom: 2.5rem;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.4em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* 見出しと今日の日付の間隔を保つスペーサー（margin ではなく空要素にして、
       h1 の letter-spacing に影響されない一定の余白を挟む） */
    h1::after {
      content: '';
      display: block;
      height: 2px;
      margin-top: 0.8rem;
    }

    .today-badge {
      margin-top: 0.6rem;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .input-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 2px; height: 100%;
      background: var(--accent-dim);
      border-radius: 4px 0 0 4px;
    }

    label {
      display: block;
      font-size: 1rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .date-fields {
      display: flex;
      align-items: center;
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .date-fields:focus-within {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .date-field-wrap {
      display: flex;
      align-items: center;
    }

    .date-field-wrap input[type="text"] {
      background: transparent;
      border: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1.2rem;
      padding: 0.9rem 0;
      outline: none;
      color: var(--text);
      caret-color: var(--accent);
      text-align: right;
    }

    /* 各入力幅は最長表示に合わせて固定（年=4文字「9999／-999」ぶん／月・日=2桁） */
    #yearInput  { width: 4.2rem; padding-left: 0.3rem; }
    #monthInput { width: 2.2rem; }
    #dayInput   { width: 2.2rem; }

    .field-unit {
      font-size: 1.05rem;
      color: var(--text-muted);
      padding-right: 0.5rem;
      user-select: none;
    }

    button {
      background: transparent;
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      color: var(--accent);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.08s;
    }

    button:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    button:active { transform: translateY(1px); }

    /* キーボード操作時のみフォーカスリングを表示 */
    button:focus-visible,
    .clear-btn:focus-visible {
      outline: 2px solid var(--accent-dim);
      outline-offset: 2px;
    }

    /* 計算中（fetch 中）の二重送信防止状態を視覚化 */
    button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
    button:disabled:hover {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    /* タッチ端末：タップ後に背景を残さない（PCのホバーは不変） */
    @media (hover: none) {
      .bc-toggle:hover,
      #calcBtn:hover,
      #clearInputBtn:hover {
        background: transparent;
        color: var(--accent);
        border-color: var(--accent-dim);
      }
    }

    /* 日付入力群と計算ボタンの間を空ける */
    #calcBtn { margin-left: 3rem; }

    /* 符号トグル（スマホのみ表示／計算・クリアと同じ配色） */
    .bc-toggle { display: none; }

    .result-area {
      min-height: 5rem;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
      animation: fadeSlide 0.3s ease;
      position: relative;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-card.is-error  { border-left: 2px solid var(--error); }
    .result-card.is-past   { border-left: 2px solid var(--past); }
    .result-card.is-today  { border-left: 2px solid var(--today); }
    .result-card.is-future { border-left: 2px solid var(--future); }

    .result-date {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.2rem;
    }

    .result-diff {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 1.1;
      margin: 0.5rem 0 0;
    }

    /* 状態→本文色の対応はここ1系統に集約。is-* が付いた要素（結果カード／履歴の差分）で
       --diff-color が定まり、結果カードは子孫の .result-diff へ継承、履歴は同一要素で解決する。
       cls が未知・空のときは --diff-color 未定義となり color は var(--text) へ落ちる */
    .is-past   { --diff-color: var(--past); }
    .is-today  { --diff-color: var(--today); }
    .is-future { --diff-color: var(--future); }
    .result-diff,
    .history-item-diff { color: var(--diff-color); }

    .error-msg {
      color: var(--error);
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* 履歴 */
    .history { margin-top: 1.5rem; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      padding: 0.3rem 0.9rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .clear-btn:hover {
      background: none;
      border: 1px solid var(--text-muted);
      color: var(--text-dim);
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: border-color 0.2s;
    }

    .history-item:hover { border-color: var(--accent-dim); }

    /* 日付部分は控えめな色に。差分の色は上の --diff-color 系統でまとめて解決する
       （history-item-diff には結果カードと同じ is- 接頭辞が付く） */
    .history-item-date { color: var(--text-dim); }

    /* ───────── スマホ対応 ───────── */
    @media (max-width: 600px) {
      body { padding: 1.5rem 0.9rem; }

      header { margin-bottom: 1.8rem; }
      h1 { font-size: 1.6rem; letter-spacing: 0.25em; }

      .input-section { padding: 1.2rem; }

      /* 入力行を縦に折り返す */
      .input-row { flex-wrap: wrap; gap: 0.8rem; }

      /* 日付フィールドを横幅いっぱいに、左寄せにする */
      .date-fields {
        width: 100%;
        justify-content: flex-start;
      }
      .date-field-wrap input[type="text"] { padding: 0.8rem 0; }

      /* 紀元前トグルをスマホで表示 */
      .bc-toggle {
        display: inline-block;
        padding: 0.8rem 0.9rem;
        white-space: nowrap;
      }

      /* ボタンは横並びで均等幅・タップしやすいサイズに */
      #calcBtn { margin-left: 0; }
      #calcBtn, #clearInputBtn {
        flex: 1 1 0;
        padding: 0.8rem 0.5rem;
      }

      .result-card { padding: 1.2rem; }
      .result-diff { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>日数計算機</h1>
    <div class="today-badge" id="todayBadge"></div>
  </header>

  <div class="input-section">
    <label>日付を入力</label>
    <div class="input-row">
      <div class="date-fields">
        <div class="date-field-wrap">
          <!-- maxlength=5 は正規化前に数字を最大5桁まで受ける MAX_YEAR_DIGITS に合わせた枠。
               有効値は最長4文字（9999／-999）で、範囲外は桁を削らず clampYearValue が上限・下限へ寄せる -->
          <input type="text" id="yearInput"  inputmode="numeric" maxlength="5" autocomplete="off" spellcheck="false">
          <span class="field-unit">年</span>
        </div>
        <div class="date-field-wrap">
          <input type="text" id="monthInput" inputmode="numeric" maxlength="2" autocomplete="off" spellcheck="false">
          <span class="field-unit">月</span>
        </div>
        <div class="date-field-wrap">
          <input type="text" id="dayInput"   inputmode="numeric" maxlength="2" autocomplete="off" spellcheck="false">
          <span class="field-unit">日</span>
        </div>
      </div>
      <button type="button" id="bcToggle" class="bc-toggle">−</button>
      <button type="button" id="calcBtn">計算</button>
      <button type="button" id="clearInputBtn">クリア</button>
    </div>
  </div>

  <!-- 計算結果・エラーはここに動的に差し替わる -->
  <div class="result-area" id="resultArea"></div>

  <div class="history" id="historySection" hidden>
    <div class="history-header">
      <h2 class="history-title">履歴</h2>
      <button type="button" class="clear-btn" id="clearHistoryBtn">クリア</button>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────────────────
  // DateCalc.html — Python API 呼び出し版
  // 差分の計算は持たず、年月日を /api/calculate（Flask 側）へ送って結果を表示する。
  // 今日の表示（日付・曜日・時刻／JST）・入力バリデーション・フォーカス移動・履歴表示は本ファイルが担当する。
  // ─────────────────────────────────────────────────────────────────────────

  // 曜日の漢字（月曜=0 … 日曜=6。サーバー DateCalc.py の WEEKDAYS と同じ並び）
  const WEEKDAYS = ["月", "火", "水", "木", "金", "土", "日"];
  // 履歴に残す最大件数
  const HISTORY_MAX = 5;
  // 年の入力範囲。仕様の基準は DateCalc.py の MIN_HIST_YEAR / MAX_HIST_YEAR で、ここは入力補助
  const MIN_YEAR = -999;
  const MAX_YEAR = 9999;
  // 符号を除いた数字の上限桁数。input の maxlength=5 を補う防御的な上限で、
  // 桁で切り捨てるのが目的ではない。範囲外の値は clampYearValue が上限・下限へ寄せる
  const MAX_YEAR_DIGITS = 5;
  // 応答を待つ上限
  const FETCH_TIMEOUT_MS = 10000;

  // 今日の日付・時刻(JST)を取り出すフォーマッタ。毎秒使うので生成は1回だけにする
  const JST_FORMAT = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric', month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  });

  const yearInput       = document.getElementById('yearInput');
  const monthInput      = document.getElementById('monthInput');
  const dayInput        = document.getElementById('dayInput');
  const resultArea      = document.getElementById('resultArea');
  const historySection  = document.getElementById('historySection');
  const historyList     = document.getElementById('historyList');
  const calcBtn         = document.getElementById('calcBtn');
  const clearInputBtn   = document.getElementById('clearInputBtn');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const bcToggle        = document.getElementById('bcToggle');
  const todayBadge      = document.getElementById('todayBadge');

  // ── 今日の表示（JST） ────────────────────────────────────────────────────
  // 日付・曜日・時刻を日本標準時で求める（同じ瞬間から全項目を取り出す）
  function getTodayParts() {
    const parts = JST_FORMAT.formatToParts(new Date());
    const value = t => parts.find(p => p.type === t).value;
    const year  = parseInt(value('year'), 10);
    const month = parseInt(value('month'), 10);
    const day   = parseInt(value('day'), 10);
    // 曜日文字列はロケール依存になるため formatter からは取らず、JST の年月日から算出する。
    // UTC 日付の index を WEEKDAYS で引く（getUTCDay の日曜=0 を月曜=0 に正規化）
    const weekday = WEEKDAYS[(new Date(Date.UTC(year, month - 1, day)).getUTCDay() + 6) % 7];
    const time = `${parseInt(value('hour'), 10)}:${value('minute')}`;   // 時は先頭ゼロを落とす
    return { year, month, day, weekday, time };
  }

  let badgeText = '';   // 直前に描画したバッジ文字列。変化が無い秒は DOM を触らない
  let todayKey  = '';   // 直前に描画した JST の日付

  // 今日の日付・曜日・時刻をヘッダーのバッジ（todayBadge）へ描画する
  function renderTodayBadge() {
    const t = getTodayParts();

    // 0時をまたぐと、表示中の結果・履歴は前日の「今日」を基準にした古い値になるので消す
    const key = `${t.year}-${t.month}-${t.day}`;
    if (todayKey && key !== todayKey) clearResults();
    todayKey = key;

    const text = `${t.year}年${t.month}月${t.day}日 (${t.weekday}) ${t.time}`;
    if (text === badgeText) return;
    badgeText = text;
    todayBadge.textContent = text;
  }

  // ── 全角→半角の畳み込み ──────────────────────────────────────────────────
  //   JS の \d は ASCII の [0-9] だけなので、全角数字を畳まずに [^\d] で濾すと入力が丸ごと消える。
  //   IME を全角にしたままの入力や、日本語の文書からの貼り付けを救うため、濾す前に必ず通す。
  //   マイナスは IME の状態次第で全角ハイフン・長音・各種ダッシュのいずれにもなりうるので、まとめて '-' へ寄せる。
  const toHalfWidth = s => s
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[－−ー―‐–—]/g, '-');

  // ── 年フィールドの正規化（input のたびに呼ぶ） ───────────────────────────
  //   先頭のマイナス1つ ＋ 数字のみ、先頭ゼロ除去、数字は MAX_YEAR_DIGITS 桁まで
  function normalizeYearValue() {
    const raw = toHalfWidth(yearInput.value);
    const neg = raw.startsWith('-');
    let digits = raw.replace(/[^\d]/g, '').replace(/^0+/, '');
    if (digits.length > MAX_YEAR_DIGITS) digits = digits.slice(0, MAX_YEAR_DIGITS);
    const v = (neg ? '-' : '') + digits;
    if (yearInput.value !== v) yearInput.value = v;
  }

  // ── 年フィールドの範囲補正（blur と符号切り替えの後に呼ぶ） ───────────────
  //   範囲外は桁を落とさず上限・下限へ寄せる（-2020 は BC202 ではなく BC999 になる）
  function clampYearValue() {
    const val = parseInt(yearInput.value, 10);
    if (isNaN(val)) yearInput.value = '';                        // 空・単独の「-」
    else if (val > MAX_YEAR) yearInput.value = String(MAX_YEAR);
    else if (val < MIN_YEAR) yearInput.value = String(MIN_YEAR);
  }

  // 数字があるときだけ範囲補正を通す（単独の「-」は消さずに残す）。
  // bcToggle と calculate の送信直前で共有し、理由コメントをここ1箇所に集約する。
  // blur 時は単独の「-」を消したいので、そこは clampYearValue を直接呼ぶ（別挙動）
  function clampYearIfHasDigits() {
    if (/\d/.test(yearInput.value)) clampYearValue();
  }

  // ── − ボタン：符号を切り替えたうえで、PCと同じ正規化・補正を通す ──────────
  bcToggle.addEventListener('click', () => {
    const digits = yearInput.value.replace('-', '');
    yearInput.value = yearInput.value.startsWith('-') ? digits : '-' + digits;
    normalizeYearValue();
    clampYearIfHasDigits();   // 単独「-」は維持したまま範囲補正
    yearInput.focus();
  });

  // ── 入力キーの制限 ───────────────────────────────────────────────────────
  //   数字以外の「文字キー」だけを弾く。修飾キー付き（Ctrl+V / Ctrl+A / Ctrl+Z 等）と
  //   機能キー（Backspace・矢印・Home・End 等）はブラウザに任せる。
  //   ここを通り抜けた不正な文字（貼り付け・ドラッグ&ドロップ）は input 側の正規化が取り除く。
  function isBlockedKey(ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return false;
    if (ev.key.length !== 1) return false;
    return !/^\d$/.test(ev.key);
  }

  // ── フィールド間フォーカス移動 ───────────────────────────────────────────
  function moveFocusToStart(target) {
    target.focus();
    target.setSelectionRange(0, 0);
  }
  function moveFocusToEnd(target) {
    target.focus();
    const pos = target.value.length;
    target.setSelectionRange(pos, pos);
  }

  const atStart = input => input.selectionStart === 0 && input.selectionEnd === 0;
  const atEnd   = input => input.selectionStart === input.value.length && input.selectionEnd === input.value.length;

  // ── 月・日フィールドの正規化：数字のみ（1〜99。maxlength=2 と先頭ゼロ除去で範囲は自明） ──
  function normalizeDigits(input) {
    const v = toHalfWidth(input.value).replace(/[^\d]/g, '').replace(/^0+/, '');
    if (input.value !== v) input.value = v;
  }

  // ── フィールド共通の挙動をまとめて登録する ───────────────────────────────
  //   3フィールドの違いは「隣が誰か」「Enter で何をするか」「正規化の中身」「符号を許すか」だけなので、
  //   それだけを引数に取る。ここを1本にしておかないと、入力の直し（全角の畳み込み等）が3箇所に散る。
  //     prev / next … Backspace（空のとき）・矢印キーで移動する隣のフィールド（無ければ省略）
  //     onEnter     … Enter を押したときの動作
  //     normalize   … input / IME 確定後に走らせる正規化
  //     allowMinus  … 先頭のマイナス1つを許すか（年だけ true）
  //     onBlur      … blur 時の追加処理（年の範囲補正）
  function attachNumericField(input, { prev, next, onEnter, normalize, allowMinus = false, onBlur }) {
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); onEnter(); return; }
      if (prev && ev.key === 'Backspace' && input.value === '') { ev.preventDefault(); moveFocusToEnd(prev); return; }
      if (next && ev.key === 'ArrowRight' && atEnd(input))   { ev.preventDefault(); moveFocusToStart(next); return; }
      if (prev && ev.key === 'ArrowLeft'  && atStart(input)) { ev.preventDefault(); moveFocusToEnd(prev); return; }

      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;   // ショートカットは素通し
      if (allowMinus && ev.key === '-') {                  // 符号は先頭に1つだけ
        if (input.selectionStart !== 0 || input.value.startsWith('-')) ev.preventDefault();
        return;
      }
      if (isBlockedKey(ev)) { ev.preventDefault(); return; }
      // 先頭の 0 は打たせない（入力しても正規化で消えるため）。年は符号の次を「先頭」とみなす
      const effectiveStart = allowMinus && input.value.startsWith('-') ? 1 : 0;
      if (ev.key === '0' && input.selectionStart === effectiveStart) ev.preventDefault();
    });

    // IME の変換中は value を書き換えない（変換候補が壊れる）。確定後にまとめて正規化する
    input.addEventListener('input', ev => { if (!ev.isComposing) normalize(); });
    input.addEventListener('compositionend', () => normalize());
    if (onBlur) input.addEventListener('blur', onBlur);
  }

  attachNumericField(yearInput, {
    next: monthInput,
    onEnter: () => moveFocusToStart(monthInput),
    normalize: normalizeYearValue,
    allowMinus: true,
    onBlur: clampYearValue,
  });
  attachNumericField(monthInput, {
    prev: yearInput,
    next: dayInput,
    onEnter: () => moveFocusToStart(dayInput),
    normalize: () => normalizeDigits(monthInput),
  });
  attachNumericField(dayInput, {
    prev: monthInput,
    onEnter: () => calculate(),
    normalize: () => normalizeDigits(dayInput),
  });

  // ── 出力エスケープ（サーバー応答を innerHTML に挿入する際の XSS 防御） ────────
  //   要素内容は escapeHtml で無害化する。class 属性に入る cls は既知3値のみ許可し、未知値は空にする。
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  const RESULT_CLASSES = new Set(['past', 'today', 'future']);
  const safeCls = c => (RESULT_CLASSES.has(c) ? c : '');
  // 既知3値のときだけ ` is-xxx` を返す。未知値では空文字にして裸の `is-` を残さない
  const clsAttr = c => (safeCls(c) ? ` is-${safeCls(c)}` : '');

  // ── 履歴 ─────────────────────────────────────────────────────────────────
  let historyItems = [];   // window.history を隠さないよう history とは別名にする

  function renderHistory() {
    historySection.hidden = historyItems.length === 0;
    historyList.innerHTML = historyItems.map(h => `
      <li class="history-item">
        <span class="history-item-date">${escapeHtml(h.dateStr)}</span>
        <span class="history-item-diff${clsAttr(h.cls)}">${escapeHtml(h.diffLabel)}</span>
      </li>`).join('');
  }

  // ── 結果表示 ─────────────────────────────────────────────────────────────
  function showError(message) {
    resultArea.innerHTML =
      `<div class="result-card is-error"><div class="error-msg">${escapeHtml(message)}</div></div>`;
  }

  // 正常結果を結果カードとして描画（紀元前は API 側で BC 表記のラベルが返る）
  function renderResult(data) {
    resultArea.innerHTML = `
      <div class="result-card${clsAttr(data.cls)}">
        <div class="result-date">${escapeHtml(data.date_label)}</div>
        <div class="result-diff">${escapeHtml(data.diff_label)}</div>
      </div>`;
  }

  // 履歴へ追加（重複は先頭に移動、最大 HISTORY_MAX 件）
  function pushHistory(data) {
    const entry = { dateStr: data.date_label, diffLabel: data.diff_label, cls: data.cls };
    historyItems = [entry, ...historyItems.filter(h => h.dateStr !== entry.dateStr)].slice(0, HISTORY_MAX);
    renderHistory();
  }

  // 結果カードと履歴を消す（0時をまたいで「今日」の基準が変わったとき）
  function clearResults() {
    resultArea.innerHTML = '';
    historyItems = [];
    renderHistory();
  }

  // ── 計算：fetch で Python API を呼び出す ──────────────────────────────────
  // /api/calculate を叩いて結果 JSON を返す。通信・パース失敗時は例外を投げる（UI 制御は呼び出し側）。
  // 対応範囲外・存在しない日付はサーバーが 200 + JSON（ok:false）で返す。
  // （400 になるのは year/month/day が欠落・非整数のときだけで、その経路は上の入力チェックでほぼ通らない）
  // どちらも JSON なので status は見ず、JSON でない応答（アプリの 500、プロキシの 502 など）だけを通信エラーとして扱う
  async function fetchCalculation(yStr, mStr, dStr) {
    const params = new URLSearchParams({ year: yStr, month: mStr, day: dStr });
    const res = await fetch(`/api/calculate?${params}`, { signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });
    if (!(res.headers.get('content-type') || '').includes('application/json')) {
      throw new Error(`unexpected response: ${res.status}`);
    }
    return res.json();
  }

  let inFlight = false;   // 実行中フラグ。ボタン連打だけでなく Enter 連打（calculate 直呼び）も弾く

  async function calculate() {
    if (inFlight) return;

    // ボタンのクリックでフォーカスを移さないブラウザ（Safari）では blur が発火せず範囲補正が走らないので、
    // ここで必ず通す。「画面に出ている値＝送信する値」をブラウザによらず一致させる。
    // 数字があるときだけ寄せるのは bcToggle と同じ理由で、単独の「-」を消して符号を戻さないため
    clampYearIfHasDigits();

    const yStr = yearInput.value.trim();
    const mStr = monthInput.value.trim();
    const dStr = dayInput.value.trim();
    if (!yStr || yStr === '-' || !mStr || !dStr) { showError('日付を入力してください'); return; }

    // 月・日が「単体で明らかに不正」な範囲だけ手前で弾き、無駄な通信を省く。
    // 2/30 や平年の 2/29 のような年に依存する存在判定はサーバー(is_valid_date)に委ねる。
    // 中身は normalizeDigits で数字のみ・先頭ゼロ無しが保証済みなので parseInt で足りる
    const m = parseInt(mStr, 10);
    const d = parseInt(dStr, 10);
    // 文言はサーバー(is_valid_date)の返す「この日付は存在しません」と一致させ、
    // クライアント判定かサーバー判定かでメッセージが割れないようにする
    if (m < 1 || m > 12 || d < 1 || d > 31) { showError('この日付は存在しません'); return; }

    inFlight = true;
    calcBtn.disabled = true;   // 二重送信防止（inFlight）を視覚化

    // try で包むのは通信と JSON パースだけ。結果の描画までここに入れると、
    // 描画側のバグまで catch が「通信できませんでした」に化けさせてしまう
    let data;
    try {
      data = await fetchCalculation(yStr, mStr, dStr);
    } catch (err) {
      // ネットワークエラー・タイムアウト・サーバー側の障害。原因は握り潰さずコンソールに残す
      console.error(err);
      showError('サーバーと通信できませんでした。時間をおいて再度お試しください。');
      return;
    } finally {
      inFlight = false;
      calcBtn.disabled = false;
    }

    if (!data.ok) {
      // Python 側からのエラー（存在しない日付・対応範囲外など）
      showError(data.error || 'エラーが発生しました');
      return;
    }

    renderResult(data);
    // 差0（今日）はヘッダーに常時出ており履歴に残す価値が無いため除く
    if (data.cls !== 'today') pushHistory(data);
  }

  // ── イベント登録 ──────────────────────────────────────────────────────────
  calcBtn.addEventListener('click', calculate);

  // クリアの3経路（消す対象が異なる。統合せず対応表で一望できるようにする）:
  //   入力クリア(clearInputBtn)   … 入力欄 + 結果を消す（履歴は残す）
  //   履歴クリア(clearHistoryBtn) … 履歴のみ消す
  //   日付切替(clearResults)      … 結果 + 履歴を消す（入力欄は残す。0時をまたいだとき）
  clearInputBtn.addEventListener('click', () => {
    yearInput.value  = '';
    monthInput.value = '';
    dayInput.value   = '';
    resultArea.innerHTML = '';
    yearInput.focus();
  });

  clearHistoryBtn.addEventListener('click', () => {
    historyItems = [];
    renderHistory();
  });

  // ── 起動 ─────────────────────────────────────────────────────────────────
  renderTodayBadge();                    // 初回即描画
  setInterval(renderTodayBadge, 1000);   // 毎秒更新（時刻の追従＋0時の日付切り替え）
</script>
</body>
</html>

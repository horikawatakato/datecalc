services:

  # ── Nginx リバースプロキシ（TLS 終端）─────────────────────────────────────
  #   CI/CD（方法1）からは docker compose pull で入れ替えるため、ホストでビルドせず
  #   GHCR の push 済みイメージを参照する。NGINX_IMAGE / WEB_IMAGE は deploy が .env に
  #   不変の digest 固定参照（…@sha256:…）として書き出す。未設定時は :latest にフォールバック。
  #   ※ nginx 設定はこのイメージに焼き込まれる（テンプレート nginx/nginx.conf.template）。
  #     ドメイン名だけは起動時に環境変数 DOMAIN から envsubst で展開されるため、ここで渡す。
  proxy:
    image: ${NGINX_IMAGE:-ghcr.io/horikawatakato/proxy:latest}
    environment:
      - TZ=Asia/Tokyo          # コンテナのタイムゾーンを日本時間に設定
      - DOMAIN=${DOMAIN:?DOMAIN is required (set it in .env; deploy writes it from the GitHub repo variable)}  # nginx.conf に展開するドメイン
    ports:
      - "80:80"     # HTTP（ACME チャレンジ + HTTPS へのリダイレクト用）
      - "443:443"   # HTTPS
    volumes:
      - ./certbot/conf:/etc/letsencrypt        # 取得した証明書の保存先（ホストに永続化）
      - ./certbot/www:/var/www/certbot         # HTTP-01 チャレンジの webroot
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # command を上書きすると公式 entrypoint がテンプレート展開（envsubst）をスキップするため、
    # まず 20-envsubst-on-templates.sh を明示実行して ${DOMAIN} 入りの nginx.conf を生成し、
    # その後で「6 時間ごとに nginx をリロード（証明書更新の反映）」しつつ nginx を前景起動する。
    command: >
      /bin/sh -c "/docker-entrypoint.d/20-envsubst-on-templates.sh;
      while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # ── Flask + Gunicorn (DateCalc) ───────────────────────────────────────────
  app:
    image: ${WEB_IMAGE:-ghcr.io/horikawatakato/app:latest}
    environment:
      - TZ=Asia/Tokyo          # コンテナのタイムゾーンを日本時間に設定
      - WEB_CONCURRENCY=2      # Gunicorn ワーカー数（コンテナ資源に合わせ調整）
    expose:
      - "8000"           # proxy からのみアクセス可。外部には公開しない。
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/today')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Certbot（Let's Encrypt 証明書の取得・自動更新）───────────────────────
  cert:
    image: certbot/certbot
    environment:
      - TZ=Asia/Tokyo          # コンテナのタイムゾーンを日本時間に設定
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12 時間ごとに更新を試行（期限が近いものだけ実際に更新される）
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped

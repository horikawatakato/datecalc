name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── 同時実行制御（ジョブ単位で制御）──────────────────────────────────────────
#    test / build / push : 共通グループ(ci-*)で cancel-in-progress: true。
#    deploy              : 専用グループ(deploy-*)で cancel-in-progress: false（直列化）。

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: horikawatakato/datecalc
  NGINX_IMAGE_NAME: horikawatakato/datecalc-nginx

jobs:
  # ── テストジョブ ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ./app
        run: pytest --tb=short -v --cov=DateCalc --cov-report=term-missing --cov-fail-under=100

  # ── ビルドジョブ ────────────────────────────────────────────────────────────
  #    Web・Nginx 両イメージをビルドし、tar として artifact に保存（PR 時もビルド確認可）
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    outputs:
      web_tags:    ${{ steps.meta.outputs.tags }}
      nginx_tags:  ${{ steps.meta-nginx.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract metadata for web image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for nginx image
        id: meta-nginx
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/web.tar
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_REVISION=${{ github.sha }}

      - name: Build nginx image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          outputs: type=docker,dest=/tmp/nginx.tar

      - name: Upload web image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-image
          path: /tmp/web.tar
          retention-days: 1

      - name: Upload nginx image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nginx-image
          path: /tmp/nginx.tar
          retention-days: 1

  # ── プッシュジョブ ──────────────────────────────────────────────────────────
  #    build の artifact を取得し、Web → Nginx の順で GHCR へ Push（PR 時はスキップ）
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name != 'pull_request'
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: none

    outputs:
      # deploy ジョブへ、実際に push した不変の manifest digest を引き渡す
      web_digest:   ${{ steps.push-web.outputs.digest }}
      nginx_digest: ${{ steps.push-nginx.outputs.digest }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web image artifact
        uses: actions/download-artifact@v7
        with:
          name: web-image
          path: /tmp

      - name: Push web image
        id: push-web
        env:
          WEB_TAGS: ${{ needs.build.outputs.web_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/web.tar
          echo "$WEB_TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
          # push 済みタグから不変の manifest digest（sha256:...）を取得して出力
          first_tag=${WEB_TAGS%%$'\n'*}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" | cut -d'@' -f2)
          if [ -z "$digest" ]; then
            echo "::error::web イメージの digest を取得できませんでした"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Download nginx image artifact
        uses: actions/download-artifact@v7
        with:
          name: nginx-image
          path: /tmp

      - name: Push nginx image
        id: push-nginx
        env:
          NGINX_TAGS: ${{ needs.build.outputs.nginx_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/nginx.tar
          echo "$NGINX_TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
          first_tag=${NGINX_TAGS%%$'\n'*}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" | cut -d'@' -f2)
          if [ -z "$digest" ]; then
            echo "::error::nginx イメージの digest を取得できませんでした"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # ── デプロイジョブ（方法1: EC2 ホストへ SSM 経由でデプロイ）─────────────────
  #    ECS は使わず、稼働中の EC2 上の docker-compose をイメージ差し替えで更新する。
  #
  #    前提（初回のみ手動で用意しておくこと）:
  #      - EC2 に SSM エージェントが動作し、インスタンスプロファイルに
  #        AmazonSSMManagedInstanceCore がアタッチされていること
  #      - ホストの ${APP_DIR}（例 /opt/datecalc）に docker-compose.yml と init-letsencrypt.sh を配置済み
  #        （nginx/ や app/ のソースは不要。イメージは GHCR から pull するため）
  #      - ホストで GHCR に認証済み（private イメージの場合）。例:
  #          echo <PAT> | docker login ghcr.io -u <user> --password-stdin
  #        もしくは GHCR パッケージを public にしておく
  #      - 初回の証明書取得（./init-letsencrypt.sh）が完了していること
  #
  #    OIDC ロール(secrets.AWS_ROLE_ARN)に必要な権限:
  #      ssm:SendCommand / ssm:GetCommandInvocation（対象インスタンスと
  #      AWS-RunShellScript ドキュメントに対して）
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: push
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: none
      id-token: write  # OIDC 認証に必要

    steps:
      # ── ① AWS 認証（OIDC）────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ── ② SSM Run Command で EC2 上の compose を digest 固定で入れ替え ───────
      #      push が出力した不変の manifest digest（@sha256:...）で web/nginx を固定。
      #      タグの上書き・再付与に左右されず、ビルドした成果物そのものを確実にデプロイする。
      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}   # 例: i-0123456789abcdef0
          APP_DIR:     ${{ vars.APP_DIR }}           # 例: /opt/datecalc
          WEB_IMAGE:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.push.outputs.web_digest }}
          NGINX_IMAGE: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}@${{ needs.push.outputs.nginx_digest }}
        run: |
          set -euo pipefail

          # ホスト上で実行するコマンド列を JSON で組み立てる。
          # web/nginx をそれぞれ digest 固定の参照として .env に書き出す。
          cat > params.json <<JSON
          {
            "commands": [
              "set -euo pipefail",
              "cd ${APP_DIR}",
              "echo WEB_IMAGE=${WEB_IMAGE} > .env",
              "echo NGINX_IMAGE=${NGINX_IMAGE} >> .env",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy datecalc ${GITHUB_SHA}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: ${CMD_ID}"

          # 完了までポーリング（最大 ~10分）。docker compose pull が長引いても待てるよう、
          # aws ssm wait の既定タイムアウト（約100秒）に依存しない。
          # 送信直後は invocation が未作成のことがあるため、取得失敗時は Pending 扱いで継続。
          STATUS="Pending"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "----- リモート標準出力 -----"
          # 表示用。取得失敗で成功デプロイを落とさないよう || true でガード
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::デプロイに失敗しました (Status=${STATUS})"
            echo "----- リモート標準エラー -----"
            aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query StandardErrorContent --output text
            exit 1
          fi
          echo "デプロイ成功"
          echo "  web:   ${WEB_IMAGE}"
          echo "  nginx: ${NGINX_IMAGE}"

      # ── ③ デプロイ内容をサマリーに出力 ──────────────────────────────────────
      - name: Summary
        if: always()
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          WEB_IMAGE:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.push.outputs.web_digest }}
          NGINX_IMAGE: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}@${{ needs.push.outputs.nginx_digest }}
        run: |
          echo "## Deploy (EC2 / SSM・digest 固定)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Instance | \`${INSTANCE_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web image | \`${WEB_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Nginx image | \`${NGINX_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY

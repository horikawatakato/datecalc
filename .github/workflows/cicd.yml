name: CICD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:   # 手動トリガー

# ── 同時実行制御（ジョブ単位で制御）──────────────────────────────────────────
#    test / build : 共通グループ(ci-*)で cancel-in-progress: true（後発ランが来ると停止）。
#    push         : 専用グループ(push-*)で cancel-in-progress: false（直列化）。
#                   GHCR への送信中に後発ランで割り込まれ、タグの一部だけ上がる
#                   中途半端な状態を避けるため、走り出した push はキャンセルしない。
#    deploy       : 専用グループ(deploy-*)で cancel-in-progress: false（直列化）。

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: horikawatakato/app
  NGINX_IMAGE_NAME: horikawatakato/proxy

jobs:
  # ── テストジョブ ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # app/Dockerfile の python:3.12-slim に合わせる
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ./app
        run: pytest --tb=short -v --cov=DateCalc --cov=DateCalc_server --cov-report=term-missing --cov-fail-under=100

  # ── ビルドジョブ ────────────────────────────────────────────────────────────
  #    app・proxy 両イメージを常にビルドして tar 出力し、push ジョブ用に artifact 保存する。
  #    （PR 時はビルド確認のみ＝tar は作るが artifact アップロードはスキップ）
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    outputs:
      app_tags:    ${{ steps.meta-app.outputs.tags }}
      proxy_tags:  ${{ steps.meta-proxy.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for proxy image
        id: meta-proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          outputs: type=docker,dest=/tmp/app.tar
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta-app.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_REVISION=${{ github.sha }}

      - name: Build proxy image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: false
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          outputs: type=docker,dest=/tmp/proxy.tar
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta-proxy.outputs.json).labels['org.opencontainers.image.created'] }}
            GIT_REVISION=${{ github.sha }}

      - name: Upload app image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-image
          path: /tmp/app.tar
          retention-days: 1

      - name: Upload proxy image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: proxy-image
          path: /tmp/proxy.tar
          retention-days: 1

  # ── プッシュジョブ ──────────────────────────────────────────────────────────
  #    build の artifact を取得し、app → proxy の順で GHCR へ Push（PR 時はスキップ）
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name != 'pull_request'
    concurrency:
      # GHCR 送信中の割り込みを避けるため直列化（走行中はキャンセルしない）
      group: push-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: none
      packages: write
      id-token: none

    outputs:
      # deploy ジョブへ、実際に push した不変の manifest digest を引き渡す
      app_digest:   ${{ steps.push-app.outputs.digest }}
      proxy_digest: ${{ steps.push-proxy.outputs.digest }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download app image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: /tmp

      - name: Push app image
        id: push-app
        env:
          APP_TAGS: ${{ needs.build.outputs.app_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/app.tar
          echo "$APP_TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
          # push 済みタグから不変の manifest digest（sha256:...）を取得して出力。
          # inspect/pipe の失敗で set -e/pipefail が即中断すると下の親切な
          # エラーが出ないため、|| true で握りつぶして空判定に委ねる。
          first_tag=${APP_TAGS%%$'\n'*}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" 2>/dev/null | cut -d'@' -f2 || true)
          if [ -z "$digest" ]; then
            echo "::error::app イメージの digest を取得できませんでした"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Download proxy image artifact
        uses: actions/download-artifact@v7
        with:
          name: proxy-image
          path: /tmp

      - name: Push proxy image
        id: push-proxy
        env:
          PROXY_TAGS: ${{ needs.build.outputs.proxy_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/proxy.tar
          echo "$PROXY_TAGS" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
          first_tag=${PROXY_TAGS%%$'\n'*}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" 2>/dev/null | cut -d'@' -f2 || true)
          if [ -z "$digest" ]; then
            echo "::error::proxy イメージの digest を取得できませんでした"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # ── デプロイジョブ（EC2 ホストへ SSM 経由でデプロイ）─────────────────
  #    ECS は使わず、稼働中の EC2 上の docker-compose をイメージ差し替えで更新する。
  #
  #    前提（初回のみ手動で用意しておくこと）:
  #      - EC2 に SSM エージェントが動作し、インスタンスプロファイルに
  #        AmazonSSMManagedInstanceCore がアタッチされていること
  #        （加えて、send-command の CloudWatchOutputEnabled で全文ログを残すには
  #         インスタンスロールに logs:CreateLogGroup / CreateLogStream / PutLogEvents が必要）
  #      - ホストの ${APP_DIR}（例 /opt/datecalc）に init-letsencrypt.sh を配置済み
  #        （docker-compose.yml は本ワークフローが毎回リポジトリ版を配布するため手動配置不要。
  #         nginx/ や app/ のソースは不要。イメージは GHCR から pull するため）
  #      - ホストで GHCR に認証済み（private イメージの場合）。例:
  #          echo <PAT> | docker login ghcr.io -u <user> --password-stdin
  #        もしくは GHCR パッケージを public にしておく
  #      - 初回の証明書取得（./init-letsencrypt.sh）が完了していること
  #
  #    OIDC ロール(secrets.AWS_ROLE_ARN)に必要な権限:
  #      ssm:SendCommand / ssm:GetCommandInvocation（対象インスタンスと
  #      AWS-RunShellScript ドキュメントに対して）
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: push
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: none
      id-token: write  # OIDC 認証に必要

    steps:
      # ── 必須の変数・シークレットの検証（未設定なら明確に失敗）────────────
      #   AWS_REGION / AWS_ROLE_ARN は直後の認証ステップで使うため、ここで先に検証する。
      - name: Validate required repository variables and secrets
        env:
          APP_DIR:         ${{ vars.APP_DIR }}
          AWS_REGION:      ${{ vars.AWS_REGION }}
          DOMAIN:          ${{ vars.DOMAIN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_ROLE_ARN:    ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          # 未設定があってもすぐ止めず、すべて出力してから最後に失敗させる。
          missing=0
          for v in APP_DIR AWS_REGION DOMAIN EC2_INSTANCE_ID; do
            # 変数・シークレットとも値は出力せず空判定のみ（特にシークレットはログにマスクが保持される）。
            if [ -z "${!v}" ]; then
              echo "::error::リポジトリ変数 $v が未設定です。Settings → Secrets and variables → Actions → Variables で設定してください。" >&2
              missing=1
            fi
          done
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "::error::リポジトリシークレット AWS_ROLE_ARN が未設定です。Settings → Secrets and variables → Actions → Secrets で設定してください。" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ── AWS 認証（OIDC）────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      # ── リポジトリを取得（docker-compose.yml をホストへ配布するため）─────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── SSM Run Command で EC2 上の compose を digest 固定で入れ替え ───────
      #      push が出力した不変の manifest digest（@sha256:...）で web/nginx を固定。
      #      タグの上書き・再付与に左右されず、ビルドした成果物そのものを確実にデプロイする。
      #      あわせてリポジトリの docker-compose.yml を base64 で送り、ホスト側へ書き出す。
      - name: Deploy to EC2 via SSM
        env:
          APP_DIR:     ${{ vars.APP_DIR }}
          DOMAIN:      ${{ vars.DOMAIN }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          WEB_IMAGE:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.push.outputs.app_digest }}
          NGINX_IMAGE: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}@${{ needs.push.outputs.proxy_digest }}
        run: |
          set -euo pipefail

          # リポジトリの docker-compose.yml を改行なし base64 にしてホストへ渡す。
          # （base64 出力は [A-Za-z0-9+/=] のみで、JSON / シェルの引用を壊さない）
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          # ホストで実行するスクリプトを1本にまとめて base64 で送り、"decode | bash" で実行する。
          # 分岐・ループ（スモークテスト/ロールバック）を含むため、コマンド配列ではなくスクリプト化する。
          #   先頭: runner 側の値を %q 安全に定義 → 以降のロジックは quoted heredoc(<<'EOF') で温存。
          {
            printf 'APP_DIR=%q\n'     "$APP_DIR"
            printf 'DOMAIN=%q\n'      "$DOMAIN"
            printf 'WEB_IMAGE=%q\n'   "$WEB_IMAGE"
            printf 'NGINX_IMAGE=%q\n' "$NGINX_IMAGE"
            printf 'COMPOSE_B64=%q\n' "$COMPOSE_B64"
            cat <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          # 現行の構成（.env と compose）を退避（ロールバック用。初回は無くてもよい）
          cp -f .env .env.bak 2>/dev/null || true
          cp -f docker-compose.yml docker-compose.yml.bak 2>/dev/null || true

          # compose をデコードして配置 → web/nginx を digest 固定の参照として .env に書き出す
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
          printf 'WEB_IMAGE=%s\nNGINX_IMAGE=%s\nDOMAIN=%s\n' "$WEB_IMAGE" "$NGINX_IMAGE" "$DOMAIN" > .env

          # pull → up → スモークテストを順に試す。失敗は if 条件で捕捉し、set -e による
          # 即時中断を避けてロールバックへ回す。up -d は depends_on の service_healthy を
          # 待つため、不正イメージ（app が unhealthy 等）では非0で返り得る点に注意。
          deploy_ok=0
          if docker compose pull && docker compose up -d; then
            # エンドツーエンドのスモークテスト（proxy→app→TLS まで通るか）を最大60秒待つ。
            # --resolve でループバック経由でも本物の証明書名で検証する。
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 5 \
                   --resolve "$DOMAIN:443:127.0.0.1" \
                   "https://$DOMAIN/api/today" >/dev/null; then
                deploy_ok=1; break
              fi
              sleep 2
            done
          fi

          # 失敗時は直前の構成（.env / compose）へ戻して再起動し、非0で終了する。
          # ※ 初回デプロイは退避（.bak）が無くロールバック先が存在しないため、
          #    起動した壊れた新構成を停止（down）してから非0終了する（初回のみ手動復旧が前提）。
          if [ "$deploy_ok" != 1 ]; then
            echo "デプロイ検証に失敗。直前の構成へロールバックします。" >&2
            if [ -f docker-compose.yml.bak ]; then mv -f docker-compose.yml.bak docker-compose.yml; fi
            rolled_back=0
            if [ -f .env.bak ]; then
              mv -f .env.bak .env
              docker compose up -d || true
              rolled_back=1
            fi
            if [ "$rolled_back" = 1 ]; then
              # ロールバック後の .env には旧 digest が入っている。今回の新イメージが
              # 旧と異なる時だけ削除する（同一 digest 再デプロイ時に稼働中を消さない）。
              # digest 参照は prune で回収されないため rm で確実に消す。
              old_web=$(grep -E '^WEB_IMAGE=' .env | head -n1 | cut -d= -f2-)
              old_nginx=$(grep -E '^NGINX_IMAGE=' .env | head -n1 | cut -d= -f2-)
              [ "$old_web"   != "$WEB_IMAGE"   ] && docker image rm -f "$WEB_IMAGE"   >/dev/null 2>&1 || true
              [ "$old_nginx" != "$NGINX_IMAGE" ] && docker image rm -f "$NGINX_IMAGE" >/dev/null 2>&1 || true
            else
              # ロールバック先が無い（初回デプロイ等）。起動済みなら壊れた新構成を残さず停止する（未起動でも down は無害）。
              echo "ロールバック先が無いため、新構成を停止します（手動復旧が必要）。" >&2
              docker compose down || true
            fi
            exit 1
          fi

          # 成功時: 旧イメージ（今回と異なる digest のみ）を削除して滞留を防ぐ。
          # digest 参照は prune では回収されないため明示削除する。同一 digest の
          # 再デプロイでは稼働中イメージを消さないよう、必ず新旧の差分を確認する。
          if [ -f .env.bak ]; then
            old_web=$(grep -E '^WEB_IMAGE=' .env.bak | head -n1 | cut -d= -f2-)
            old_nginx=$(grep -E '^NGINX_IMAGE=' .env.bak | head -n1 | cut -d= -f2-)
            [ -n "$old_web" ]   && [ "$old_web" != "$WEB_IMAGE" ]     && docker image rm -f "$old_web"   >/dev/null 2>&1 || true
            [ -n "$old_nginx" ] && [ "$old_nginx" != "$NGINX_IMAGE" ] && docker image rm -f "$old_nginx" >/dev/null 2>&1 || true
          fi

          rm -f .env.bak docker-compose.yml.bak
          docker image prune -f
          EOF
          } > remote.sh

          REMOTE_B64=$(base64 -w0 remote.sh)

          # ホストではこの1コマンドだけ実行（デコードして bash に渡す）。
          # executionTimeout: ホスト側スクリプトの実行上限（秒）。これを超えると SSM が
          #   TimedOut にして打ち切るため、CI がポーリングを諦めた後もホストで延々と走り
          #   続ける（CI 失敗表示と実機状態の乖離）のを防ぐ。CI のポーリング上限より短くする。
          cat > params.json <<JSON
          {
            "commands": [
              "echo ${REMOTE_B64} | base64 -d | bash"
            ],
            "executionTimeout": ["600"]
          }
          JSON

          # --cloud-watch-output-config: 全文ログを CloudWatch Logs へ（後述の
          #   get-command-invocation は約2500文字で truncate されるため、原因調査用に併用）。
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy datecalc ${GITHUB_SHA}" \
            --parameters file://params.json \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: ${CMD_ID}"

          # 完了までポーリング（最大 ~11分）。docker compose pull が長引いても待てるよう、
          # aws ssm wait の既定タイムアウト（約100秒）に依存しない。ホスト側 executionTimeout
          # (600s) より長く待ち、SSM が付ける終端状態(TimedOut 等)を確実に拾う。
          # 送信直後は invocation が未作成のことがあるため、取得失敗時は Pending 扱いで継続。
          STATUS="Pending"
          for _ in $(seq 1 132); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "----- リモート標準出力 -----"
          # 表示用。取得失敗で成功デプロイを落とさないよう || true でガード
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::デプロイに失敗しました (Status=${STATUS})"
            echo "----- リモート標準エラー -----"
            aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query StandardErrorContent --output text
            exit 1
          fi
          echo "デプロイ成功"
          echo "  web:   ${WEB_IMAGE}"
          echo "  nginx: ${NGINX_IMAGE}"

      # ── デプロイ内容をサマリーに出力 ──────────────────────────────────────
      - name: Summary
        if: always()
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          WEB_IMAGE:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.push.outputs.app_digest }}
          NGINX_IMAGE: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}@${{ needs.push.outputs.proxy_digest }}
        run: |
          echo "## Deploy (EC2 / SSM・digest 固定)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Instance | \`${INSTANCE_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web image | \`${WEB_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Nginx image | \`${NGINX_IMAGE}\` |" >> $GITHUB_STEP_SUMMARY

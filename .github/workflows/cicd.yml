name: CICD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:   # 手動トリガー

# 既定は権限なし。各ジョブで必要な権限だけを付与する。
permissions: {}

# ── 同時実行制御の方針（設定値は各ジョブの concurrency を参照）────────────────────────────────────
#    test / build : GHCR や本番へ影響を残さないため、後発ランが来たら中断してよい。
#    push / deploy: 中断すると GHCR や本番ホストが中途半端な状態で残るため、
#                   走行中はキャンセルせず直列化する。ただし実行順は保証されない。
#                     push  : latest / main タグは先発ランのイメージで上書きされ得る。
#                     deploy: staleness 判定で最新コミットの digest のみ反映する。

env:
  REGISTRY:         ghcr.io
  APP_IMAGE_NAME:   ${{ github.repository_owner }}/app
  PROXY_IMAGE_NAME: ${{ github.repository_owner }}/proxy

jobs:
  # ── テストジョブ ─────────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # app/Dockerfile の python:3.12-slim に合わせる
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: ./app
        run: pytest --tb=short -v --cov=DateCalc --cov=DateCalc_server --cov-report=term-missing --cov-fail-under=100

  # ── ビルドジョブ ─────────────────────────────────────────────────────────────────────────────
  #    app / proxy を常にビルドして tar 出力し、push 用に artifact 保存
  #    （main 以外は push ジョブが動かないためアップロードをスキップ）。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    outputs:
      app_tags:   ${{ steps.meta-app.outputs.tags }}
      proxy_tags: ${{ steps.meta-proxy.outputs.tags }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for proxy image
        id: meta-proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export app image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          outputs: type=docker,dest=/tmp/app.tar
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and export proxy image
        uses: docker/build-push-action@v7
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: false
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          outputs: type=docker,dest=/tmp/proxy.tar
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Upload app image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-image
          path: /tmp/app.tar
          retention-days: 1

      - name: Upload proxy image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: proxy-image
          path: /tmp/proxy.tar
          retention-days: 1

  # ── プッシュジョブ ───────────────────────────────────────────────────────────────────────────
  #    build の artifact を取得し、app → proxy の順で GHCR へ push。
  #    main 以外（PR / 他ブランチの手動実行）ではスキップし、GHCR には main のイメージだけを登録する。
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: push-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: none
      packages: write
      id-token: none

    outputs:
      # deploy ジョブ（デプロイとサマリー出力）へ、実際に push した不変の digest 固定参照（…@sha256:…）を引き渡す。
      app_image:   ${{ steps.push-app.outputs.image }}
      proxy_image: ${{ steps.push-proxy.outputs.image }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download app image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: /tmp

      - name: Load and push app image
        id: push-app
        env:
          APP_TAGS: ${{ needs.build.outputs.app_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/app.tar
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$APP_TAGS"
          # push 済みタグから digest 固定参照（<registry>/<name>@sha256:…）を取得して出力。
          # 実際に push された名前がそのまま入る（metadata-action が小文字化済み）ため、
          # deploy 側で名前を組み立て直さずに済む。
          # inspect 失敗で set -e の即中断を避けるため || true で空にし、下の -z 判定へ委ねる。
          first_tag=${APP_TAGS%%$'\n'*}
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$first_tag" || true)
          if [ -z "$image" ]; then
            echo "::error::appイメージのdigest固定参照を取得できませんでした" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Download proxy image artifact
        uses: actions/download-artifact@v7
        with:
          name: proxy-image
          path: /tmp

      - name: Load and push proxy image
        id: push-proxy
        env:
          PROXY_TAGS: ${{ needs.build.outputs.proxy_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/proxy.tar
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$PROXY_TAGS"
          first_tag=${PROXY_TAGS%%$'\n'*}
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$first_tag" || true)
          if [ -z "$image" ]; then
            echo "::error::proxyイメージのdigest固定参照を取得できませんでした" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # ── デプロイジョブ（EC2 へ SSM 経由でデプロイ）─────────────────────────────────────────────────
  #    稼働中 EC2 の compose をイメージ差し替えで更新する。
  #    main 以外（PR / 他ブランチの手動実行）ではスキップし、本番には main の変更だけを反映する。
  #
  #    前提（初回のみ手動）:
  #      - EC2 で SSM エージェント稼働＋インスタンスロールに AmazonSSMManagedInstanceCore
  #        CloudWatch 全文ログの必要権限:
  #          logs:DescribeLogGroups / CreateLogGroup / DescribeLogStreams / CreateLogStream / PutLogEvents
  #      - ホストの vars.APP_DIR（例 /opt/app）に bootstrap-https.sh 配置済み
  #        （docker-compose.yml は毎回本ワークフローが配布。app / proxy のソースは不要＝GHCR から pull）
  #      - private イメージなら GHCR 認証済み（docker login）。または public にしておく
  #      - 初回の証明書取得（./bootstrap-https.sh）完了済み
  #
  #    OIDC ロール（secrets.AWS_ROLE_ARN）の必要権限:
  #      ssm:SendCommand（対象インスタンスと AWS-RunShellScript に対して）
  #      ssm:GetCommandInvocation（リソースを指定できないため * に対して）
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: push
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: none
      id-token: write   # OIDC 認証に必要

    steps:
      # ── 必須の変数・シークレット検証（未設定なら明確に失敗）──────────────────────────────────────
      #    AWS_REGION / AWS_ROLE_ARN は直後の認証で使うため先に検証する。
      - name: Validate required repository variables and secrets
        env:
          APP_DIR:         ${{ vars.APP_DIR }}
          AWS_REGION:      ${{ vars.AWS_REGION }}
          DOMAIN:          ${{ vars.DOMAIN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_ROLE_ARN:    ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          # 未設定があってもすぐ止めず、すべて出力してから最後に失敗させる。
          missing=0
          for name in APP_DIR AWS_REGION DOMAIN EC2_INSTANCE_ID; do
            # 値は出力せず空判定のみ（変数・シークレットとも値をログに出さない方針）。
            if [ -z "${!name}" ]; then
              echo "::error::リポジトリ変数$nameが未設定です（Settings → Secrets and variables → Actions → Variables）" >&2
              missing=1
            fi
          done
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::リポジトリシークレットAWS_ROLE_ARNが未設定です（Settings → Secrets and variables → Actions → Secrets）" >&2
            missing=1
          fi
          if [ "$missing" != 0 ]; then
            exit 1
          fi

      # ── AWS 認証（OIDC）──────────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      # ── リポジトリを取得 ──────────────────────────────────────────────────────────────────────
      #    docker-compose.yml のホスト配布と、次ステップの git ls-remote の両方に必要。
      - name: Check out repository
        uses: actions/checkout@v6

      # ── stale デプロイの抑止 ──────────────────────────────────────────────────────────────────
      #    deploy は直列化されるが実行順は保証されず、先発ランの deploy が後発より後に走ると
      #    旧 digest で上書きされる。本ランの SHA がブランチ先端でなければデプロイをスキップし、
      #    後発ランが deploy まで到達した場合に限り最新を反映する。
      - name: Check if this commit is the latest on the branch
        id: staleness
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ブランチ先端のリモート最新 SHA。認証済み origin を使うので fetch-depth に依存しない。
          # ls-remote 失敗時も set -e の即中断を避けて空扱いにし、下の -z 判定（安全側で続行）へ委ねる。
          latest_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1) || latest_sha=""
          if [ -z "$latest_sha" ]; then
            echo "::warning::$BRANCHの最新SHAを取得できなかったため、安全側でデプロイを続行します" >&2
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::本ラン（${GITHUB_SHA:0:7}）は$BRANCHの最新（${latest_sha:0:7}）ではないため、デプロイをスキップして以降のランに委ねます"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      # ── SSM Run Command で EC2 の compose を digest 固定で入れ替え ────────────────────────────
      #    push が出力した digest 固定参照（…@sha256:…）で app / proxy を固定＝タグ上書きに左右されず
      #    成果物そのものをデプロイ。docker-compose.yml も base64 で送りホストへ書き出す。
      - name: Deploy to EC2 via SSM
        id: deploy
        if: steps.staleness.outputs.is_latest == 'true'
        env:
          APP_DIR:         ${{ vars.APP_DIR }}
          DOMAIN:          ${{ vars.DOMAIN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_IMAGE:       ${{ needs.push.outputs.app_image }}
          PROXY_IMAGE:     ${{ needs.push.outputs.proxy_image }}
        run: |
          set -euo pipefail

          # ステップ終了時刻（JST）をサマリー出力へ渡す。EXIT トラップなので成功 / 失敗どちらでも発火。
          trap 'echo "finished_at=$(TZ=Asia/Tokyo date "+%Y/%m/%d %H:%M:%S")" >> "$GITHUB_OUTPUT"' EXIT

          # docker-compose.yml を改行なし base64 でホストへ渡す（JSON / シェルの引用を壊さない）。
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          # ホスト実行スクリプトを1本にまとめ base64 で送って "decode | bash"。
          # 分岐・ループ（スモークテスト / ロールバック）を含むためスクリプト化する。
          #   先頭で runner 側の値を %q 安全に定義 → 以降は quoted heredoc（<<'EOF'）で温存。
          {
            printf 'APP_DIR=%q\n'     "$APP_DIR"
            printf 'DOMAIN=%q\n'      "$DOMAIN"
            printf 'APP_IMAGE=%q\n'   "$APP_IMAGE"
            printf 'PROXY_IMAGE=%q\n' "$PROXY_IMAGE"
            printf 'COMPOSE_B64=%q\n' "$COMPOSE_B64"
            cat <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          # 現行の構成（.env と compose）を退避（ロールバック用。初回は無くてもよい）。
          cp -f .env .env.bak 2>/dev/null || true
          cp -f docker-compose.yml docker-compose.yml.bak 2>/dev/null || true

          # compose をデコードして配置 → app / proxy を digest 固定参照として .env に書き出す。
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
          printf 'APP_IMAGE=%s\nPROXY_IMAGE=%s\nDOMAIN=%s\n' "$APP_IMAGE" "$PROXY_IMAGE" "$DOMAIN" > .env

          # 稼働中コンテナのイメージが今回の digest を持つか照合し、一致 / 不一致 / 不明を返す。
          # 取得失敗時は空扱いにし、不明とする。
          check_digest() {
            local service=$1 expected_image=$2
            local container_id image_id repo_digests
            container_id=$(docker compose ps -q "$service" 2>/dev/null) || container_id=""
            image_id=$(docker container inspect --format '{{.Image}}' "$container_id" 2>/dev/null) || image_id=""
            repo_digests=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_id" 2>/dev/null) || repo_digests=""
            if [ -z "$repo_digests" ]; then
              echo "不明"
            elif grep -Fxq -- "$expected_image" <<< "$repo_digests"; then
              echo "一致"
            else
              echo "不一致"
            fi
          }

          # スモークテストの対象は、テストとログの表示で同じ値を使う。
          smoke_url="https://$DOMAIN/api/today"

          # pull → up → digest 照合 → スモークテストを順に試す。
          # 失敗は if で捕捉し set -e の即中断を避けてロールバックへ回す
          # （up -d は service_healthy 待ちで、unhealthy 時は非0で返り得る）。
          deploy_ok=0
          if docker compose pull && docker compose up -d; then
            # 稼働中コンテナのイメージを今回の digest と照合する。
            # 不一致は新構成が反映されていないため、スモークテストを行わずロールバックへ回す。
            # 不明は失敗と断定できないため続行する。
            proxy_digest_match=$(check_digest proxy "$PROXY_IMAGE")
            app_digest_match=$(check_digest app "$APP_IMAGE")
            if [ "$proxy_digest_match" = 不一致 ] || [ "$app_digest_match" = 不一致 ]; then
              echo "digest照合に失敗しました（proxy: $proxy_digest_match、app: $app_digest_match）" >&2
            else
              # E2E スモークテスト（TLS → proxy → app）。2秒間隔で最大30回試行
              # （curl のタイムアウト5秒込みで最長約3.5分）。
              # --resolve でループバック経由でも本物の証明書名で検証する。
              # HTTP ステータスは、成功 / 失敗どちらでも結果の根拠としてログに添える。
              for _ in $(seq 1 30); do
                if http_code=$(curl -fsS --max-time 5 -o /dev/null -w '%{http_code}' \
                    --resolve "$DOMAIN:443:127.0.0.1" \
                    "$smoke_url"); then
                  deploy_ok=1
                  break
                fi
                sleep 2
              done
              if [ "$deploy_ok" != 1 ]; then
                echo "スモークテストに失敗しました（最後の試行: HTTP $http_code）" >&2
              fi
            fi
          fi

          # 失敗時は直前の構成（.env / compose）へ戻して再起動し非0終了。
          # ※ 初回は .bak が無くロールバック先が無いため、壊れた新構成を down してから
          #    非0終了する（初回のみ手動復旧が前提）。
          if [ "$deploy_ok" != 1 ]; then
            echo "デプロイに失敗したため、直前の構成への復旧を試みます" >&2
            if [ -f docker-compose.yml.bak ]; then
              mv -f docker-compose.yml.bak docker-compose.yml
            fi
            rolled_back=0
            if [ -f .env.bak ]; then
              mv -f .env.bak .env
              # 成否を残す（|| true だと復旧できたか判別できない）。set -e の即中断は if で回避。
              if docker compose up -d; then
                echo "直前の構成へ復旧しました" >&2
              else
                echo "直前の構成への復旧に失敗しました（手動復旧が必要）" >&2
              fi
              rolled_back=1
            fi
            if [ "$rolled_back" = 1 ]; then
              # ロールバック後の .env は旧 digest。新イメージが旧と異なるときだけ削除する
              # （同一 digest 再デプロイ時は稼働中を消さない）。digest 参照は prune 対象外のため rm。
              # grep が no-match で exit 1 → set -e の即中断を避けるため || true で空に。
              old_app_image=$(grep -E '^APP_IMAGE=' .env | head -n1 | cut -d= -f2- || true)
              old_proxy_image=$(grep -E '^PROXY_IMAGE=' .env | head -n1 | cut -d= -f2- || true)
              [ "$old_app_image"   != "$APP_IMAGE"   ] && docker image rm -f "$APP_IMAGE"   >/dev/null 2>&1 || true
              [ "$old_proxy_image" != "$PROXY_IMAGE" ] && docker image rm -f "$PROXY_IMAGE" >/dev/null 2>&1 || true
            else
              # ロールバック先が無い（初回等）。起動済みなら壊れた新構成を停止（未起動でも down は無害）。
              echo "直前の構成が無いため、新構成を停止します（手動復旧が必要）" >&2
              docker compose down || true
            fi
            exit 1
          fi

          # 成功時: 旧イメージ（今回と異なる digest のみ）を削除して滞留を防ぐ。
          # digest 参照は prune 対象外のため明示削除。同一 digest 再デプロイでは
          # 稼働中を消さないよう必ず新旧の差分を確認する。
          if [ -f .env.bak ]; then
            # grep が no-match で exit 1 → set -e の即中断を避けるため || true で空に。
            old_app_image=$(grep -E '^APP_IMAGE=' .env.bak | head -n1 | cut -d= -f2- || true)
            old_proxy_image=$(grep -E '^PROXY_IMAGE=' .env.bak | head -n1 | cut -d= -f2- || true)
            [ -n "$old_app_image" ]   && [ "$old_app_image" != "$APP_IMAGE" ]     && docker image rm -f "$old_app_image"   >/dev/null 2>&1 || true
            [ -n "$old_proxy_image" ] && [ "$old_proxy_image" != "$PROXY_IMAGE" ] && docker image rm -f "$old_proxy_image" >/dev/null 2>&1 || true
          fi

          rm -f .env.bak docker-compose.yml.bak

          # デプロイ先（EC2）と稼働状態を出力（取得に失敗してもデプロイは成功扱い）。
          imds_token=$(curl -fsS --max-time 2 -X PUT -H "X-aws-ec2-metadata-token-ttl-seconds: 60" \
            http://169.254.169.254/latest/api/token 2>/dev/null || true)
          imds() { curl -fsS --max-time 2 -H "X-aws-ec2-metadata-token: $imds_token" \
            "http://169.254.169.254/latest/meta-data/$1" 2>/dev/null || echo "不明"; }
          echo "デプロイ先: EC2"
          echo "  instance-type:     $(imds instance-type)"
          echo "  availability-zone: $(imds placement/availability-zone)"
          echo "コンテナ状態:"
          for service in proxy app cert; do
            state=$(docker compose ps -a --format '{{.State}}{{if .Health}} ({{.Health}}){{end}}' "$service" 2>/dev/null || true)
            printf '  %-7s%s\n' "$service:" "${state:-不明}"
          done
          echo "digest照合:"
          printf '  %-7s%s\n' "proxy:" "$proxy_digest_match" "app:" "$app_digest_match"
          echo "スモークテスト:"
          echo "  対象: $smoke_url"
          echo "  結果: 成功（HTTP $http_code）"

          # dangling イメージの削除で解放した容量のみ出力（prune に失敗してもデプロイは成功扱い）。
          reclaimed=$(docker image prune -f 2>/dev/null | tail -n1 || true)
          reclaimed=${reclaimed#Total reclaimed space: }
          echo "danglingイメージ削除による解放容量: ${reclaimed:-不明}"
          EOF
          } > remote.sh

          REMOTE_B64=$(base64 -w0 remote.sh)

          # ホストではこの1コマンドだけ実行（デコードして bash）。
          # executionTimeout: ホスト側の実行上限（秒）。超過で SSM が TimedOut にして打ち切り、
          #   CI 諦め後もホストが走り続ける乖離を防ぐ。CI のポーリング上限より短くする。
          cat > params.json <<JSON
          {
            "commands": [
              "echo $REMOTE_B64 | base64 -d | bash"
            ],
            "executionTimeout": ["600"]
          }
          JSON

          # --cloud-watch-output-config: 全文ログを CloudWatch Logs へ
          #   （get-command-invocation の出力は先頭24,000文字で truncate されるため原因調査用に併用）。
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_REPOSITORY $GITHUB_SHA" \
            --parameters file://params.json \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query Command.CommandId --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # 完了までポーリング（最長約11分）。aws ssm wait の既定（約100秒）に依存せず、
          # ホスト側 executionTimeout（600秒）より長く待って終端状態（TimedOut 等）を確実に拾う。
          # 送信直後は invocation 未作成のことがあるため、取得失敗時は Pending 扱いで継続。
          STATUS="Pending"
          for _ in $(seq 1 132); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "----- リモート標準出力 -----"
          # 表示用。取得失敗で成功デプロイを落とさないよう || true でガード。
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          if [ "$STATUS" != Success ]; then
            # 非終端（Pending / InProgress）で抜けるのは EC2 停止・SSM 不達・API 継続失敗の場合で、
            # 実行して失敗したのではなく結果が不明。失敗と断定せず区別して出す。
            case "$STATUS" in
              Failed|Cancelled|TimedOut)
                echo "::error::デプロイに失敗しました（Status $STATUS）" >&2 ;;
              *)
                echo "::error::デプロイの結果を確認できませんでした（Status $STATUS）" >&2
                echo "result=unknown" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "----- リモート標準エラー -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

          # デプロイ結果の根拠として、ホストで実行したスクリプトの終了コード（SSM の ResponseCode）を添える。
          # 取得失敗で成功デプロイを落とさないよう || true でガード。
          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query ResponseCode --output text 2>/dev/null || true)
          echo "デプロイ結果: 成功（ResponseCode ${RESPONSE_CODE:-不明}）"

      # ── デプロイ結果をサマリーに出力 ───────────────────────────────────────────────────────────
      - name: Write deployment summary
        # 本ランがデプロイ対象（is_latest=true）のときだけ出す。
        #   - stale スキップ（is_latest=false）: 「デプロイ済み」と誤表示しないよう出さない。
        #   - staleness 到達前の失敗（検証 / 認証 / checkout）: 出力が空 → 出さない（誤表示防止）。
        #   - デプロイ失敗（is_latest=true のままエラー）: 原因調査のため出す。
        if: always() && steps.staleness.outputs.is_latest == 'true'
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_RESULT:  ${{ steps.deploy.outputs.result }}
          FINISHED_AT:    ${{ steps.deploy.outputs.finished_at }}
          APP_IMAGE:      ${{ needs.push.outputs.app_image }}
          PROXY_IMAGE:    ${{ needs.push.outputs.proxy_image }}
        run: |
          set -euo pipefail
          case "$DEPLOY_OUTCOME" in
            success)   RESULT="✅ 成功" ;;
            failure)   RESULT="❌ 失敗" ;;
            cancelled) RESULT="⚠️ 中断" ;;
            skipped)   RESULT="⚠️ 未実行" ;;
            *)         RESULT="⚠️ $DEPLOY_OUTCOME" ;;
          esac
          # 非終端で終わった場合は失敗と断定できないため上書きする。
          if [ "$DEPLOY_RESULT" = unknown ]; then
            RESULT="⚠️ 不明"
          fi
          # 出力は「ラベル<br>値」を空行区切り。GFM は単一改行を空白に畳むため <br> で改行する。
          {
            echo "**デプロイ結果**<br>$RESULT"
            echo ""
            echo "**終了時刻**<br>$FINISHED_AT"
            echo ""
            echo "**app**<br>$APP_IMAGE"
            echo ""
            echo "**proxy**<br>$PROXY_IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

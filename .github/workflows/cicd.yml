name: CICD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:   # 手動トリガー

# ── 同時実行制御の方針（設定値は各ジョブの concurrency を参照）───────────────
#    test / build : GHCR や本番へ影響を残さないので、後発ランが来たら中断してよい。
#    push / deploy: 中断すると GHCR や本番ホストが中途半端な状態で残るため、走行中は
#                   キャンセルせず直列化する（順序は保証されない ＝ deploy の staleness 判定で補正）。

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository_owner }}/app
  PROXY_IMAGE_NAME: ${{ github.repository_owner }}/proxy

jobs:
  # ── テストジョブ ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # app/Dockerfile の python:3.12-slim に合わせる
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ./app
        run: pytest --tb=short -v --cov=DateCalc --cov=DateCalc_server --cov-report=term-missing --cov-fail-under=100

  # ── ビルドジョブ ────────────────────────────────────────────────────────────
  #    app・proxy を常にビルドして tar 出力し、push 用に artifact 保存
  #    （main 以外は push ジョブが動かないためアップロードをスキップ）。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: none
      id-token: none

    outputs:
      app_tags:    ${{ steps.meta-app.outputs.tags }}
      proxy_tags:  ${{ steps.meta-proxy.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for proxy image
        id: meta-proxy
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          outputs: type=docker,dest=/tmp/app.tar
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build proxy image
        uses: docker/build-push-action@v7
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: false
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          outputs: type=docker,dest=/tmp/proxy.tar
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      - name: Upload app image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-image
          path: /tmp/app.tar
          retention-days: 1

      - name: Upload proxy image artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: proxy-image
          path: /tmp/proxy.tar
          retention-days: 1

  # ── プッシュジョブ ──────────────────────────────────────────────────────────
  #    build の artifact を取得し、app → proxy の順で GHCR へ Push。
  #    main 以外（PR / 他ブランチの手動実行）ではスキップし、GHCR を汚さない。
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: push-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: none
      packages: write
      id-token: none

    outputs:
      # deploy / Summary へ、実際に push した不変の digest 固定参照（…@sha256:…）を引き渡す
      app_image:   ${{ steps.push-app.outputs.image }}
      proxy_image: ${{ steps.push-proxy.outputs.image }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download app image artifact
        uses: actions/download-artifact@v7
        with:
          name: app-image
          path: /tmp

      - name: Push app image
        id: push-app
        env:
          APP_TAGS: ${{ needs.build.outputs.app_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/app.tar
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$APP_TAGS"
          # push 済みタグから digest 固定参照（<registry>/<name>@sha256:…）を取得して出力。
          # 実際に push された名前がそのまま入る（metadata-action が小文字化済み）ため、
          # deploy 側で名前を組み立て直さずに済む。
          # inspect 失敗で set -e が即中断しないよう || true で空にし、下の -z 判定へ委ねる。
          first_tag=${APP_TAGS%%$'\n'*}
          image=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" 2>/dev/null || true)
          if [ -z "$image" ]; then
            echo "::error::app イメージの digest 固定参照を取得できませんでした" >&2; exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Download proxy image artifact
        uses: actions/download-artifact@v7
        with:
          name: proxy-image
          path: /tmp

      - name: Push proxy image
        id: push-proxy
        env:
          PROXY_TAGS: ${{ needs.build.outputs.proxy_tags }}
        run: |
          set -euo pipefail
          docker load --input /tmp/proxy.tar
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$PROXY_TAGS"
          first_tag=${PROXY_TAGS%%$'\n'*}
          image=$(docker inspect --format='{{index .RepoDigests 0}}' "$first_tag" 2>/dev/null || true)
          if [ -z "$image" ]; then
            echo "::error::proxy イメージの digest 固定参照を取得できませんでした" >&2; exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # ── デプロイジョブ（EC2 へ SSM 経由でデプロイ）────────────────────────
  #    稼働中 EC2 の docker-compose をイメージ差し替えで更新する。
  #
  #    前提（初回のみ手動）:
  #      - EC2 で SSM エージェント稼働＋インスタンスロールに AmazonSSMManagedInstanceCore
  #        （CloudWatch 全文ログ用に logs:CreateLogGroup / CreateLogStream / PutLogEvents も）
  #        （docker-compose.yml は毎回本ワークフローが配布。app/proxy のソースは不要＝GHCR から pull）
  #      - private イメージなら GHCR 認証済み（docker login）。または public にしておく
  #
  #    OIDC ロール(secrets.AWS_ROLE_ARN)の必要権限:
  #      ssm:SendCommand / ssm:GetCommandInvocation（対象インスタンスと AWS-RunShellScript に対して）
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: push
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: none
      id-token: write  # OIDC 認証に必要

    steps:
      # ── 必須の変数・シークレット検証（未設定なら明確に失敗）───────────────
      #   AWS_REGION / AWS_ROLE_ARN は直後の認証で使うため先に検証する。
      - name: Validate required repository variables and secrets
        env:
          APP_DIR:         ${{ vars.APP_DIR }}
          AWS_REGION:      ${{ vars.AWS_REGION }}
          DOMAIN:          ${{ vars.DOMAIN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_ROLE_ARN:    ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          # 未設定があってもすぐ止めず、すべて出力してから最後に失敗させる。
          missing=0
          for v in APP_DIR AWS_REGION DOMAIN EC2_INSTANCE_ID; do
            # 値は出力せず空判定のみ（変数・シークレットとも値をログに出さない方針）。
            if [ -z "${!v}" ]; then
              echo "::error::リポジトリ変数 $v が未設定です（Settings → Secrets and variables → Actions → Variables）。" >&2
              missing=1
            fi
          done
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "::error::リポジトリシークレット AWS_ROLE_ARN が未設定です（Settings → Secrets and variables → Actions → Secrets）。" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ── AWS 認証（OIDC）────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      # ── リポジトリを取得 ──────────────────────────────────────────────────
      #    docker-compose.yml のホスト配布と、次ステップの git ls-remote の両方に必要。
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── stale デプロイの抑止（実行順が不定な理由は冒頭の同時実行制御を参照）──────
      #    ブランチ先端が本ランの SHA より新しければデプロイをスキップし、古い digest での
      #    上書きを防ぐ（後発ランが最新を反映。Deploy / Summary をこの出力でゲート）。
      - name: Skip if a newer commit exists on the branch
        id: staleness
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ブランチ先端のリモート最新 SHA。認証済み origin を使うので fetch-depth に依存しない。
          # ls-remote 失敗時も set -e で止めず空扱いにし、下の -z 判定（安全側で続行）へ委ねる。
          latest=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1) || latest=""
          if [ -z "$latest" ]; then
            echo "::warning::${BRANCH} の最新 SHA を取得できませんでした。安全側でデプロイを続行します。" >&2
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::${BRANCH} の最新は ${latest}。本ラン(${GITHUB_SHA})はより古いためデプロイをスキップします（後発ランが最新を反映）。"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      # ── SSM Run Command で EC2 の compose を digest 固定で入れ替え ─────────
      #      push が出力した digest 固定参照（…@sha256:...）で app/proxy を固定＝タグ上書きに
      #      左右されず成果物そのものをデプロイ。docker-compose.yml も base64 で送りホストへ書き出す。
      - name: Deploy to EC2 via SSM
        id: deploy
        if: steps.staleness.outputs.is_latest == 'true'
        env:
          APP_DIR:     ${{ vars.APP_DIR }}
          DOMAIN:      ${{ vars.DOMAIN }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_IMAGE:   ${{ needs.push.outputs.app_image }}
          PROXY_IMAGE: ${{ needs.push.outputs.proxy_image }}
        run: |
          set -euo pipefail

          # ステップ終了時刻(JST)を Summary へ渡す。EXIT トラップなので成功/失敗どちらでも発火。
          trap 'echo "finished_at=$(TZ=Asia/Tokyo date "+%Y/%m/%d %H:%M:%S")" >> "$GITHUB_OUTPUT"' EXIT

          # docker-compose.yml を改行なし base64 でホストへ渡す（JSON/シェルの引用を壊さない）。
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          # ホスト実行スクリプトを1本にまとめ base64 で送って "decode | bash"。
          # 分岐・ループ（スモークテスト/ロールバック）を含むためスクリプト化する。
          #   先頭で runner 側の値を %q 安全に定義 → 以降は quoted heredoc(<<'EOF') で温存。
          {
            printf 'APP_DIR=%q\n'     "$APP_DIR"
            printf 'DOMAIN=%q\n'      "$DOMAIN"
            printf 'APP_IMAGE=%q\n'   "$APP_IMAGE"
            printf 'PROXY_IMAGE=%q\n' "$PROXY_IMAGE"
            printf 'COMPOSE_B64=%q\n' "$COMPOSE_B64"
            cat <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"

          # 現行の構成（.env と compose）を退避（ロールバック用。初回は無くてもよい）
          cp -f .env .env.bak 2>/dev/null || true
          cp -f docker-compose.yml docker-compose.yml.bak 2>/dev/null || true

          # compose をデコードして配置 → app/proxy を digest 固定の参照として .env に書き出す
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
          printf 'APP_IMAGE=%s\nPROXY_IMAGE=%s\nDOMAIN=%s\n' "$APP_IMAGE" "$PROXY_IMAGE" "$DOMAIN" > .env

          # pull → up → スモークテストを順に試す。失敗は if で捕捉し set -e の即中断を避けて
          # ロールバックへ回す（up -d は service_healthy 待ちで、unhealthy 時は非0で返り得る）。
          deploy_ok=0
          if docker compose pull && docker compose up -d; then
            # E2E スモークテスト（TLS→proxy→app）。2秒間隔で最大30回試行
            # （curl のタイムアウト5秒込みで最長 ~3.5分）。
            # --resolve でループバック経由でも本物の証明書名で検証する。
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 5 \
                   --resolve "$DOMAIN:443:127.0.0.1" \
                   "https://$DOMAIN/api/today" >/dev/null; then
                deploy_ok=1; break
              fi
              sleep 2
            done
          fi

          # 失敗時は直前の構成（.env / compose）へ戻して再起動し非0終了。
          # ※ 初回は .bak が無くロールバック先が無いため、壊れた新構成を down してから
          #    非0終了する（初回のみ手動復旧が前提）。
          if [ "$deploy_ok" != 1 ]; then
            echo "デプロイ検証に失敗。直前の構成への復旧を試みます。" >&2
            if [ -f docker-compose.yml.bak ]; then mv -f docker-compose.yml.bak docker-compose.yml; fi
            rolled_back=0
            if [ -f .env.bak ]; then
              mv -f .env.bak .env
              docker compose up -d || true
              rolled_back=1
            fi
            if [ "$rolled_back" = 1 ]; then
              # ロールバック後の .env は旧 digest。新イメージが旧と異なる時だけ削除する
              # （同一 digest 再デプロイ時は稼働中を消さない）。digest 参照は prune 対象外のため rm。
              # grep が no-match で exit 1 → set -e 中断を防ぐため || true で空に。
              old_app=$(grep -E '^APP_IMAGE=' .env | head -n1 | cut -d= -f2- || true)
              old_proxy=$(grep -E '^PROXY_IMAGE=' .env | head -n1 | cut -d= -f2- || true)
              [ "$old_app"   != "$APP_IMAGE"   ] && docker image rm -f "$APP_IMAGE"   >/dev/null 2>&1 || true
              [ "$old_proxy" != "$PROXY_IMAGE" ] && docker image rm -f "$PROXY_IMAGE" >/dev/null 2>&1 || true
            else
              # ロールバック先が無い（初回等）。起動済みなら壊れた新構成を停止（未起動でも down は無害）。
              echo "ロールバック先が無いため、新構成を停止します（手動復旧が必要）。" >&2
              docker compose down || true
            fi
            exit 1
          fi

          # 成功時: 旧イメージ（今回と異なる digest のみ）を削除して滞留を防ぐ。
          # digest 参照は prune 対象外のため明示削除。同一 digest 再デプロイでは
          # 稼働中を消さないよう必ず新旧の差分を確認する。
          if [ -f .env.bak ]; then
            # grep が no-match で exit 1 → set -e 中断を防ぐため || true で空に。
            old_app=$(grep -E '^APP_IMAGE=' .env.bak | head -n1 | cut -d= -f2- || true)
            old_proxy=$(grep -E '^PROXY_IMAGE=' .env.bak | head -n1 | cut -d= -f2- || true)
            [ -n "$old_app" ]   && [ "$old_app" != "$APP_IMAGE" ]     && docker image rm -f "$old_app"   >/dev/null 2>&1 || true
            [ -n "$old_proxy" ] && [ "$old_proxy" != "$PROXY_IMAGE" ] && docker image rm -f "$old_proxy" >/dev/null 2>&1 || true
          fi

          rm -f .env.bak docker-compose.yml.bak
          docker image prune -f
          EOF
          } > remote.sh

          REMOTE_B64=$(base64 -w0 remote.sh)

          # ホストではこの1コマンドだけ実行（デコードして bash）。
          # executionTimeout: ホスト側の実行上限（秒）。超過で SSM が TimedOut にして打ち切り、
          #   CI 諦め後もホストが走り続ける乖離を防ぐ。CI のポーリング上限より短くする。
          cat > params.json <<JSON
          {
            "commands": [
              "echo ${REMOTE_B64} | base64 -d | bash"
            ],
            "executionTimeout": ["600"]
          }
          JSON

          # --cloud-watch-output-config: 全文ログを CloudWatch Logs へ
          #   （get-command-invocation の出力は先頭 24,000 文字で truncate されるため原因調査用に併用）。
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_REPOSITORY} ${GITHUB_SHA}" \
            --parameters file://params.json \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: ${CMD_ID}"

          # 完了までポーリング（最大 ~11分）。aws ssm wait の既定(約100秒)に依存せず、
          # ホスト側 executionTimeout(600s) より長く待って終端状態(TimedOut 等)を確実に拾う。
          # 送信直後は invocation 未作成のことがあるため、取得失敗時は Pending 扱いで継続。
          STATUS="Pending"
          for _ in $(seq 1 132); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "----- リモート標準出力 -----"
          # 表示用。取得失敗で成功デプロイを落とさないよう || true でガード
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::デプロイに失敗しました (Status=${STATUS})" >&2
            echo "----- リモート標準エラー -----"
            aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query StandardErrorContent --output text
            exit 1
          fi
          echo "デプロイ成功"
          echo "  app:   ${APP_IMAGE}"
          echo "  proxy: ${PROXY_IMAGE}"

      # ── デプロイ結果をサマリーに出力 ──────────────────────────────────────
      - name: Summary
        # is_latest=true（本ランが最新でデプロイを試行した）ときだけ出す。
        #   - stale スキップ（is_latest=false）: 「デプロイ済み」と誤表示しないよう出さない。
        #   - staleness 到達前の失敗（検証/認証/checkout）: 出力が空 → 出さない（誤表示防止）。
        #   - デプロイ失敗（is_latest=true のままエラー）: 原因調査のため出力する。
        if: always() && steps.staleness.outputs.is_latest == 'true'
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FINISHED_AT:    ${{ steps.deploy.outputs.finished_at }}
          APP_IMAGE:      ${{ needs.push.outputs.app_image }}
          PROXY_IMAGE:    ${{ needs.push.outputs.proxy_image }}
        run: |
          case "$DEPLOY_OUTCOME" in
            success) RESULT="✅ 成功" ;;
            failure) RESULT="❌ 失敗" ;;
            *)       RESULT="⚠️ $DEPLOY_OUTCOME" ;;
          esac
          # 出力は「ラベル<br>値」を空行区切り。GFM は単一改行を空白に畳むため <br> で改行する。
          {
            echo "**デプロイ結果**<br>${RESULT}"
            echo ""
            echo "**完了時刻**<br>${FINISHED_AT}"
            echo ""
            echo "**App**<br>${APP_IMAGE}"
            echo ""
            echo "**Proxy**<br>${PROXY_IMAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

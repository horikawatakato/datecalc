# Dependabot 設定
#   cicd.yml の Action は供給網対策でコミット SHA に固定している。SHA 固定は
#   自動更新が止まるため、Dependabot で SHA を追従させる（PR で SHA を更新）。
version: 2
updates:
  # GitHub Actions（cicd.yml の uses: を SHA ごと更新）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Python 依存（app/requirements*.txt）
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # Docker ベースイメージ（app/Dockerfile・nginx/Dockerfile の FROM）
  - package-ecosystem: docker
    directories:
      - /app
      - /nginx
    schedule:
      interval: weekly
    commit-message:
      prefix: docker

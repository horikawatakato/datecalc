worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # アップストリーム: Gunicorn（docker-compose サービス名 "web"）
    upstream flask_app {
        server web:8000;
        keepalive 32;
    }

    # ── HTTP(80): ACME チャレンジ応答 + HTTPS へリダイレクト ──────────────────
    #   Let's Encrypt の HTTP-01 チャレンジ（/.well-known/acme-challenge/）だけは
    #   リダイレクトせず素通しさせ、それ以外は 443 へ恒久リダイレクトする。
    server {
        listen 80;
        server_name datecalc.duckdns.org;   # ← 取得したサブドメインに変更してください

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;           # certbot の webroot と共有
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS(443): TLS 終端して Gunicorn へプロキシ ─────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name datecalc.duckdns.org;   # ← 同上

        # certbot が取得した証明書（certbot/conf ボリューム内）
        ssl_certificate     /etc/letsencrypt/live/datecalc.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/datecalc.duckdns.org/privkey.pem;

        # TLS の推奨設定
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: 以後このホストへは常に HTTPS で接続させる（HTTP 強制対策）
        # ※ HTTPS 運用を確定後に有効化。HTTP へ戻す予定がある間はコメントアウト推奨。
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ── / および /api/* はすべて Gunicorn へ ──────────────────────────
        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";   # upstream keepalive を有効化

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;  # TLS 終端後なので https 固定

            proxy_connect_timeout 60s;
            proxy_read_timeout    60s;
        }

        # ── ヘルスチェック ─────────────────────────────────────────────────
        location /api/today {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            access_log off;
        }
    }
}
